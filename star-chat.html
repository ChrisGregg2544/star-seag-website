<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --gold:#C9A84C; --gold-light:#E8C97A; --gold-dim:rgba(201,168,76,0.14);
      --navy:#0B1F3A; --navy-mid:#0f2747; --navy-card:#112240;
      --text-dark:#0B1F3A; --text-mid:#3a5070;
      --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
      --radius:16px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:var(--navy); font-family:'Lato',sans-serif;
      display:flex; flex-direction:column; align-items:center;
      overflow-x:hidden; position:relative;
    }

    /* Background */
    .bg-atmosphere { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .bg-glow { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(201,168,76,.05) 0%,transparent 65%); width:700px; height:700px; top:5%; left:50%; transform:translateX(-50%); }
    .bg-glow-2 { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(59,130,246,.03) 0%,transparent 70%); width:400px; height:400px; bottom:-80px; right:-80px; }
    .star-p { position:absolute; border-radius:50%; background:var(--gold); opacity:.07; animation:twinkle var(--d,3.8s) ease-in-out infinite alternate; animation-delay:var(--del,0s); }
    @keyframes twinkle { from{opacity:.03;} to{opacity:.14;} }

    /* Nav */
    .top-nav {
      position:relative; z-index:10; width:100%; max-width:760px;
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 16px 14px;
    }
    .nav-logo { display:flex; align-items:center; gap:9px; text-decoration:none; }
    .nav-logo-name { font-family:Georgia,'Times New Roman',serif; font-size:1.05rem; font-weight:700; color:var(--gold); letter-spacing:.06em; }
    .nav-logo-sub { font-family:'Lato',sans-serif; font-size:.52rem; font-weight:700; color:rgba(201,168,76,.65); letter-spacing:.2em; text-transform:uppercase; }
    .nav-back-btn {
      font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      padding:7px 14px; border-radius:8px; cursor:pointer; border:none;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.55); font-family:'Lato',sans-serif;
      text-decoration:none; transition:all .2s;
    }
    .nav-back-btn:hover { background:rgba(255,255,255,.1); color:rgba(255,255,255,.8); }

    /* Chat container */
    .chat-wrap {
      position:relative; z-index:10; width:100%; max-width:760px;
      display:flex; flex-direction:column;
      height:calc(100vh - 80px);
      padding:0 16px 16px;
    }

    /* Header */
    .chat-header {
      background:linear-gradient(135deg,var(--navy-card) 0%,#0d1e38 100%);
      border:1px solid rgba(201,168,76,.2);
      border-radius:20px 20px 0 0;
      padding:20px 24px 16px;
      display:flex; align-items:center; gap:14px;
      flex-shrink:0;
    }
    .chat-avatar {
      width:44px; height:44px; border-radius:50%;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; flex-shrink:0;
    }
    .chat-header-name { font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; color:#fff; }
    .chat-header-sub { font-size:.75rem; color:rgba(255,255,255,.4); margin-top:2px; }
    .chat-mode-badge {
      margin-left:auto; font-size:.65rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; padding:4px 10px; border-radius:12px;
      background:var(--gold-dim); border:1px solid rgba(201,168,76,.3); color:var(--gold);
    }
    .chat-mode-badge.parent { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.3); color:#7ab3f5; }

    /* Messages area */
    .chat-messages {
      flex:1; overflow-y:auto;
      background:rgba(11,31,58,0.6);
      border-left:1px solid rgba(201,168,76,.12);
      border-right:1px solid rgba(201,168,76,.12);
      padding:20px 20px 12px;
      display:flex; flex-direction:column; gap:14px;
      scroll-behavior:smooth;
    }
    .chat-messages::-webkit-scrollbar { width:4px; }
    .chat-messages::-webkit-scrollbar-track { background:transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background:rgba(201,168,76,.2); border-radius:2px; }

    /* Message bubbles */
    .msg { display:flex; gap:10px; align-items:flex-end; animation:msgIn .22s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
    .msg.user { flex-direction:row-reverse; }
    .msg-avatar {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:.85rem;
    }
    .msg-avatar.star { background:linear-gradient(135deg,var(--gold),var(--gold-light)); }
    .msg-avatar.user-av { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); }
    .msg-bubble {
      max-width:75%; padding:11px 15px; border-radius:16px;
      font-size:.88rem; line-height:1.55; word-wrap:break-word;
    }
    .msg.star .msg-bubble {
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.9); border-bottom-left-radius:4px;
    }
    .msg.user .msg-bubble {
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--navy); font-weight:500; border-bottom-right-radius:4px;
    }
    /* Markdown rendered inside star bubbles */
    .msg.star .msg-bubble h3 { font-size:.9rem; font-weight:700; margin:8px 0 4px; color:#fff; }
    .msg.star .msg-bubble ul { padding-left:18px; margin:4px 0; }
    .msg.star .msg-bubble li { margin:2px 0; }
    .msg.star .msg-bubble strong { color:#fff; font-weight:700; }
    .msg.star .msg-bubble hr { border:none; border-top:1px solid rgba(255,255,255,.15); margin:8px 0; }
    .msg.star .msg-bubble p { margin:0 0 6px; }
    .msg.star .msg-bubble p:last-child { margin-bottom:0; }

    /* Typing indicator */
    .typing-indicator { display:flex; gap:10px; align-items:flex-end; }
    .typing-bubble {
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
      border-radius:16px; border-bottom-left-radius:4px;
      padding:11px 16px; display:flex; gap:5px; align-items:center;
    }
    .typing-dot {
      width:7px; height:7px; border-radius:50%;
      background:rgba(255,255,255,.35);
      animation:typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay:.15s; }
    .typing-dot:nth-child(3) { animation-delay:.3s; }
    @keyframes typingBounce {
      0%,60%,100% { transform:translateY(0); opacity:.35; }
      30% { transform:translateY(-5px); opacity:.9; }
    }

    /* Input bar */
    .chat-input-bar {
      background:var(--navy-card);
      border:1px solid rgba(201,168,76,.2);
      border-top:none;
      border-radius:0 0 20px 20px;
      padding:14px 16px;
      display:flex; gap:10px; align-items:flex-end;
      flex-shrink:0;
    }
    .chat-input {
      flex:1; background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1); border-radius:12px;
      color:#fff; font-size:.9rem; font-family:'Lato',sans-serif;
      padding:10px 14px; resize:none; outline:none;
      max-height:120px; line-height:1.5;
      transition:border-color .2s;
    }
    .chat-input::placeholder { color:rgba(255,255,255,.3); }
    .chat-input:focus { border-color:rgba(201,168,76,.4); }
    .send-btn {
      width:42px; height:42px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      border:none; cursor:pointer; font-size:1rem;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s, opacity .15s;
    }
    .send-btn:hover:not(:disabled) { transform:scale(1.08); }
    .send-btn:disabled { opacity:.45; cursor:default; }

    /* Context loading state */
    .context-loading {
      text-align:center; padding:20px;
      color:rgba(255,255,255,.4); font-size:.82rem; font-style:italic;
    }

    /* Error toast */
    .error-toast {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
      background:rgba(239,68,68,.9); color:#fff; border-radius:10px;
      padding:10px 18px; font-size:.82rem; z-index:100;
      opacity:0; transition:opacity .3s; pointer-events:none;
    }
    .error-toast.show { opacity:1; }
  </style>
</head>
<body>

<div class="bg-atmosphere">
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
  <div class="star-p" style="width:180px;height:180px;top:8%;left:3%;--d:5s;--del:.4s;"></div>
  <div class="star-p" style="width:90px;height:90px;top:55%;right:4%;--d:4.2s;--del:1.1s;"></div>
</div>

<nav class="top-nav">
  <a href="#" class="nav-logo" onclick="goBack();return false;">
    <svg class="nav-logo-mark" width="28" height="28" viewBox="0 0 28 28">
      <polygon points="14,2 17.5,10.5 26,11.5 20,17.5 21.5,26 14,22 6.5,26 8,17.5 2,11.5 10.5,10.5" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="nav-logo-name">STAR</div>
      <div style="font-size:.52rem;font-weight:700;color:rgba(201,168,76,.65);letter-spacing:.2em;text-transform:uppercase;">AI Tutor</div>
    </div>
  </a>
  <a href="#" class="nav-back-btn" onclick="goBack();return false;">← Dashboard</a>
</nav>

<div class="chat-wrap">
  <div class="chat-header">
    <div class="chat-avatar" id="chat-avatar">⭐</div>
    <div>
      <div class="chat-header-name" id="chat-title">STAR Chat</div>
      <div class="chat-header-sub" id="chat-subtitle">Your SEAG exam tutor</div>
    </div>
    <span class="chat-mode-badge" id="mode-badge">Student</span>
  </div>

  <div class="chat-messages" id="chat-messages">
    <!-- messages injected here -->
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="chat-input" rows="1"
      placeholder="Ask me anything about the SEAG exam…"></textarea>
    <button class="send-btn" id="send-btn" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="error-toast" id="error-toast"></div>

<script>
  const SUPABASE_URL = 'https://iutcgogmxhaqgaxkznxu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dtdGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1MjA5MzEsImV4cCI6MjA1OTA5NjkzMX0.L9vBMj3LQkOqOxBMbvMkH9Z5W3TRdiLnGo9MjXg9_p8';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(window.location.search);
  const isParent = params.get('mode') === 'parent';

  let history = [];   // { role, content }[]
  let childData = null;
  let isWaiting = false;

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('chat-messages');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send-btn');
  const titleEl    = document.getElementById('chat-title');
  const subtitleEl = document.getElementById('chat-subtitle');
  const badgeEl    = document.getElementById('mode-badge');
  const avatarEl   = document.getElementById('chat-avatar');

  function goBack() {
    if (isParent) window.location.href = 'parent.html';
    else          window.location.href = 'dashboard.html';
  }

  // ── Append a message bubble ───────────────────────────────────────────────────
  function appendMsg(role, text) {
    const isUser = role === 'user';
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'star'}`;

    const av = document.createElement('div');
    av.className = `msg-avatar ${isUser ? 'user-av' : 'star'}`;
    av.textContent = isUser ? '👤' : (isParent ? '🎓' : '⭐');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (isUser) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = marked.parse(text);
    }

    div.appendChild(av);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing-indicator';

    const av = document.createElement('div');
    av.className = 'msg-avatar star';
    av.textContent = isParent ? '🎓' : '⭐';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    div.appendChild(av);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showError(msg) {
    const el = document.getElementById('error-toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ── Send a message ────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMsg('user', text);
    showTyping();

    try {
      const res = await fetch('/api/star-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history,
          mode: isParent ? 'parent' : 'student',
          childData,
        }),
      });

      const data = await res.json();
      hideTyping();

      if (!res.ok || !data.reply) {
        showError('Something went wrong. Please try again.');
        return;
      }

      appendMsg('assistant', data.reply);

      // Update history (keep last 10 turns = 20 messages)
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      hideTyping();
      showError('Connection error. Please check your internet and try again.');
    } finally {
      isWaiting = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Input events ──────────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Weeks to exam calculator ──────────────────────────────────────────────────
  function calcWeeksToExam(examYear) {
    if (!examYear) return null;
    // Transfer test is sat in mid-November each year
    const examDate = new Date(parseInt(examYear), 10, 15); // Nov 15
    const now = new Date();
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const weeks = Math.round((examDate - now) / msPerWeek);
    return weeks > 0 ? weeks : null;
  }

  // ── Fetch parent child data from Supabase ─────────────────────────────────────
  async function fetchChildData(userId) {
    const loading = document.createElement('div');
    loading.className = 'context-loading';
    loading.id = 'ctx-loading';
    loading.textContent = 'Loading your child\'s data…';
    messagesEl.appendChild(loading);

    try {
      // profiles (name + exam_year)
      const { data: profile } = await sb
        .from('profiles')
        .select('name, exam_year')
        .eq('id', userId)
        .maybeSingle();

      const childName  = profile?.name ? profile.name.split(' ')[0] : null;
      const examYear   = profile?.exam_year ?? null;
      const weeksToExam = calcWeeksToExam(examYear);

      // progress_summary
      const { data: ps } = await sb
        .from('progress_summary')
        .select('last_score, topics_to_review')
        .eq('id', userId)
        .maybeSingle();

      // sessions count
      const { count: sessionsCount } = await sb
        .from('sessions')
        .select('id', { count: 'exact', head: true })
        .eq('user_id', userId);

      // topic accuracy from question_results
      const { data: qr } = await sb
        .from('question_results')
        .select('topic, correct')
        .eq('user_id', userId);

      // Aggregate by topic
      const topicMap = {};
      (qr || []).forEach(r => {
        if (!r.topic) return;
        if (!topicMap[r.topic]) topicMap[r.topic] = { correct: 0, total: 0 };
        topicMap[r.topic].total++;
        if (r.correct) topicMap[r.topic].correct++;
      });

      const topicAccuracy = Object.entries(topicMap)
        .filter(([, v]) => v.total >= 3)
        .map(([topic, v]) => ({
          topic,
          correct: v.correct,
          total: v.total,
          accuracy: Math.round((v.correct / v.total) * 100),
        }))
        .sort((a, b) => a.accuracy - b.accuracy);

      const weakTopics = (ps?.topics_to_review || []).length > 0
        ? ps.topics_to_review
        : topicAccuracy.filter(t => t.accuracy < 60).map(t => t.topic);

      childData = {
        childName,
        examYear,
        weeksToExam,
        lastScore:     ps?.last_score ?? null,
        sessionsCount: sessionsCount ?? 0,
        weakTopics,
        topicAccuracy,
      };

    } catch (err) {
      console.warn('[star-chat] Could not fetch child data:', err.message);
      childData = null;
    } finally {
      document.getElementById('ctx-loading')?.remove();
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  async function init() {
    const { data: authData, error: authErr } = await sb.auth.getSession();
    if (authErr || !authData?.session) {
      window.location.href = 'login.html';
      return;
    }

    const userId = authData.session.user.id;

    if (isParent) {
      titleEl.textContent   = 'STAR Parent Advisor';
      subtitleEl.textContent = 'Personalised advice for your child\'s transfer test prep';
      avatarEl.textContent  = '🎓';
      badgeEl.textContent   = 'Parent';
      badgeEl.classList.add('parent');
      document.title = 'STAR – Parent Advisor';
      inputEl.placeholder = 'Ask for advice about your child\'s transfer test preparation…';

      await fetchChildData(userId);

      // Greeting for parent mode
      const childFirstName = childData?.childName || 'your child';
      const greeting = childData?.lastScore != null
        ? `Hi! I'm STAR Parent Advisor. I can see ${childFirstName} has completed ${childData.sessionsCount} session${childData.sessionsCount !== 1 ? 's' : ''} with an overall score of ${childData.lastScore}%. How can I help you support their transfer test preparation today?`
        : `Hi! I'm STAR Parent Advisor. I'm here to help you support ${childFirstName}'s transfer test preparation. What would you like to know?`;

      appendMsg('assistant', greeting);
    } else {
      // Student greeting
      const { data: profile } = await sb
        .from('profiles')
        .select('name')
        .eq('id', userId)
        .maybeSingle();

      const firstName = (profile?.name || '').split(' ')[0] || 'there';
      appendMsg('assistant',
        `Hi ${firstName}! I'm STAR, your transfer test tutor. 🌟 I'm here to help you with anything about the exam — maths, English, exam tips, or just to explain something you're stuck on. What would you like help with today?`
      );
    }

    inputEl.focus();
  }

  init();
</script>
</body>
</html>
