<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --orange:#F97316; --orange-dark:#EA6C0A; --orange-light:#FB923C;
      --yellow:#F59E0B; --yellow-dark:#D97706;
      --cream:#FEF3E2; --cream-border:#F0E0C0;
      --green:#58CC02; --green-dark:#46A302;
      --blue:#1CB0F6; --blue-dark:#0D8FCC;
      --card-border:#E8D8B8;
      --text-dark:#333333; --text-mid:#666666; --text-light:#999999;
      --radius:16px; --radius-btn:12px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:var(--cream);
      font-family:'Nunito',sans-serif;
      display:flex; flex-direction:column;
      overflow-x:hidden;
    }

    /* ── Nav ─────────────────────────────────────────────────────────────────── */
    .top-nav {
      position:sticky; top:0; z-index:100;
      width:100%; height:64px;
      background:var(--orange);
      box-shadow:0 4px 0 var(--orange-dark);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px;
      flex-shrink:0;
    }
    .nav-logo {
      display:flex; align-items:center; gap:10px;
      text-decoration:none;
    }
    .nav-logo-star {
      width:40px; height:40px; border-radius:10px;
      background:var(--yellow);
      box-shadow:0 3px 0 var(--yellow-dark);
      display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; flex-shrink:0;
    }
    .nav-logo-wordmark {
      display:flex; flex-direction:column; line-height:1;
    }
    .nav-logo-name {
      font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:900;
      color:#fff; letter-spacing:.04em;
    }
    .nav-logo-sub {
      font-size:.52rem; font-weight:700; color:rgba(255,255,255,.7);
      letter-spacing:.18em; text-transform:uppercase; margin-top:2px;
    }
    .nav-right { display:flex; align-items:center; gap:8px; }
    .nav-btn {
      font-family:'Nunito',sans-serif; font-size:.78rem; font-weight:700;
      letter-spacing:.04em; text-transform:uppercase;
      padding:8px 16px; border-radius:8px; cursor:pointer;
      border:none; text-decoration:none; transition:all .15s;
    }
    .nav-exit {
      background:rgba(255,255,255,.2); color:#fff;
      border:2px solid rgba(255,255,255,.3);
    }
    .nav-exit:hover { background:rgba(255,255,255,.3); }
    .nav-mode-badge {
      font-size:.65rem; font-weight:800; letter-spacing:.1em;
      text-transform:uppercase; padding:5px 12px; border-radius:20px;
    }
    .nav-mode-badge.student {
      background:var(--green); color:#fff;
      box-shadow:0 2px 0 var(--green-dark);
    }
    .nav-mode-badge.parent {
      background:var(--blue); color:#fff;
      box-shadow:0 2px 0 var(--blue-dark);
    }

    /* ── Page layout ─────────────────────────────────────────────────────────── */
    .chat-page {
      flex:1; display:flex; flex-direction:column;
      max-width:760px; width:100%;
      margin:0 auto;
      padding:20px 16px 0;
      min-height:0;
    }

    /* ── Chat container ──────────────────────────────────────────────────────── */
    .chat-wrap {
      flex:1; display:flex; flex-direction:column;
      background:#fff;
      border:2px solid var(--card-border);
      border-radius:20px;
      box-shadow:0 4px 0 rgba(0,0,0,0.08);
      overflow:hidden;
      min-height:0;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    .chat-header {
      background:#fff;
      border-bottom:2px solid var(--cream-border);
      padding:16px 20px;
      display:flex; align-items:center; gap:14px;
      flex-shrink:0;
    }
    .chat-avatar {
      width:44px; height:44px; border-radius:50%;
      background:var(--yellow);
      box-shadow:0 3px 0 var(--yellow-dark);
      display:flex; align-items:center; justify-content:center;
      font-size:1.4rem; flex-shrink:0;
    }
    .chat-header-name {
      font-size:1.05rem; font-weight:800; color:var(--text-dark);
    }
    .chat-header-sub {
      font-size:.75rem; font-weight:600; color:var(--text-mid); margin-top:2px;
    }
    /* mode-badge rendered inside nav now — keep this hidden fallback */
    .chat-mode-badge { display:none; }

    /* ── Messages area ───────────────────────────────────────────────────────── */
    .chat-messages {
      flex:1; overflow-y:auto;
      background:var(--cream);
      padding:20px 20px 12px;
      display:flex; flex-direction:column; gap:14px;
      scroll-behavior:smooth;
    }
    .chat-messages::-webkit-scrollbar { width:4px; }
    .chat-messages::-webkit-scrollbar-track { background:transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background:var(--cream-border); border-radius:2px; }

    /* ── Message bubbles ─────────────────────────────────────────────────────── */
    .msg { display:flex; gap:10px; align-items:flex-end; animation:msgIn .22s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
    .msg.user { flex-direction:row-reverse; }

    .msg-avatar {
      width:32px; height:32px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:.9rem;
    }
    .msg-avatar.star {
      background:var(--yellow);
      box-shadow:0 2px 0 var(--yellow-dark);
    }
    .msg-avatar.user-av {
      background:var(--orange-light);
      box-shadow:0 2px 0 var(--orange-dark);
    }

    .msg-bubble {
      max-width:75%; padding:11px 15px; border-radius:16px;
      font-size:.9rem; line-height:1.55; word-wrap:break-word;
    }
    .msg.star .msg-bubble {
      background:#fff;
      border:2px solid var(--card-border);
      border-left:4px solid var(--orange);
      color:var(--text-dark);
      border-bottom-left-radius:4px;
    }
    .msg.user .msg-bubble {
      background:var(--orange);
      color:#fff;
      font-weight:600;
      border-bottom-right-radius:4px;
      box-shadow:0 3px 0 var(--orange-dark);
    }

    /* Markdown inside STAR bubbles */
    .msg.star .msg-bubble h3 {
      font-size:.9rem; font-weight:800; margin:8px 0 4px; color:var(--text-dark);
    }
    .msg.star .msg-bubble ul { padding-left:18px; margin:4px 0; }
    .msg.star .msg-bubble li { margin:2px 0; }
    .msg.star .msg-bubble strong { color:var(--text-dark); font-weight:800; }
    .msg.star .msg-bubble hr {
      border:none; border-top:2px solid var(--cream-border); margin:8px 0;
    }
    .msg.star .msg-bubble p { margin:0 0 6px; }
    .msg.star .msg-bubble p:last-child { margin-bottom:0; }

    /* ── Typing indicator ────────────────────────────────────────────────────── */
    .typing-indicator { display:flex; gap:10px; align-items:flex-end; }
    .typing-bubble {
      background:#fff;
      border:2px solid var(--card-border);
      border-left:4px solid var(--orange);
      border-radius:16px; border-bottom-left-radius:4px;
      padding:11px 16px; display:flex; gap:5px; align-items:center;
    }
    .typing-dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--orange);
      animation:typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay:.15s; }
    .typing-dot:nth-child(3) { animation-delay:.3s; }
    @keyframes typingBounce {
      0%,60%,100% { transform:translateY(0); opacity:.4; }
      30% { transform:translateY(-5px); opacity:1; }
    }

    /* ── Input bar ───────────────────────────────────────────────────────────── */
    .chat-input-bar {
      background:#fff;
      border-top:2px solid var(--cream-border);
      padding:14px 16px;
      display:flex; gap:10px; align-items:flex-end;
      flex-shrink:0;
    }
    .chat-input {
      flex:1;
      background:#fff;
      border:2px solid var(--card-border);
      border-radius:12px;
      color:var(--text-dark);
      font-size:.9rem; font-family:'Nunito',sans-serif;
      font-weight:600;
      padding:10px 14px; resize:none; outline:none;
      max-height:120px; line-height:1.5;
      transition:border-color .2s, box-shadow .2s;
    }
    .chat-input::placeholder { color:var(--text-light); }
    .chat-input:focus {
      border-color:var(--orange);
      box-shadow:0 0 0 3px rgba(255,109,0,.12);
    }

    .send-btn {
      width:44px; height:44px; border-radius:50%; flex-shrink:0;
      background:var(--orange);
      box-shadow:0 4px 0 var(--orange-dark);
      border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s, box-shadow .15s, opacity .15s;
      color:#fff;
    }
    .send-btn:hover:not(:disabled) {
      transform:translateY(-1px);
      box-shadow:0 5px 0 var(--orange-dark);
    }
    .send-btn:active:not(:disabled) {
      transform:translateY(2px);
      box-shadow:0 2px 0 var(--orange-dark);
    }
    .send-btn:disabled {
      background:#FFAB76;
      box-shadow:0 4px 0 #D4845A;
      cursor:default;
    }

    /* ── Footer ──────────────────────────────────────────────────────────────── */
    .chat-footer {
      flex-shrink:0; padding:12px 4px 16px;
      display:flex; justify-content:center; gap:20px; flex-wrap:wrap;
    }
    .chat-footer a {
      font-size:.68rem; font-weight:600;
      color:var(--text-light); text-decoration:none;
      transition:color .18s;
    }
    .chat-footer a:hover { color:var(--text-mid); }

    /* ── Starter chips ───────────────────────────────────────────────────────── */
    .starter-chips {
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:10px; padding:4px 0 8px;
    }
    .starter-chip {
      background:#fff;
      border:2px solid #FF6B00;
      color:#FF6B00;
      border-radius:999px;
      padding:8px 16px;
      font-family:'Nunito',sans-serif;
      font-size:.85rem; font-weight:700;
      cursor:pointer; transition:background .15s, color .15s;
      white-space:nowrap;
    }
    .starter-chip:hover {
      background:#FF6B00;
      color:#fff;
    }

    /* ── Context loading ─────────────────────────────────────────────────────── */
    .context-loading {
      text-align:center; padding:20px;
      color:var(--text-light); font-size:.82rem; font-style:italic;
    }

    /* ── Error toast ─────────────────────────────────────────────────────────── */
    .error-toast {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
      background:rgba(239,68,68,.9); color:#fff; border-radius:10px;
      padding:10px 18px; font-size:.82rem; font-family:'Nunito',sans-serif;
      font-weight:700; z-index:9999;
      opacity:0; transition:opacity .3s; pointer-events:none;
    }
    .error-toast.show { opacity:1; }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="#" class="nav-logo" onclick="goBack();return false;">
    <div class="nav-logo-star">⭐</div>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;Tutor</span>
    </div>
  </a>
  <div class="nav-right">
    <span class="nav-mode-badge student" id="mode-badge">Student</span>
    <a href="#" class="nav-btn nav-exit" onclick="goBack();return false;">← Dashboard</a>
  </div>
</nav>

<div class="chat-page">
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="chat-avatar" id="chat-avatar">⭐</div>
      <div>
        <div class="chat-header-name" id="chat-title">STAR Chat</div>
        <div class="chat-header-sub" id="chat-subtitle">Your SEAG exam tutor</div>
      </div>
      <!-- hidden fallback — JS may reference this id -->
      <span class="chat-mode-badge" id="chat-mode-badge-hidden"></span>
    </div>

    <div class="chat-messages" id="chat-messages">
      <!-- messages injected here -->
    </div>

    <div class="chat-input-bar">
      <textarea class="chat-input" id="chat-input" rows="1"
        placeholder="Ask me anything about the SEAG exam…"></textarea>
      <button class="send-btn" id="send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <footer class="chat-footer">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="mailto:staraitutor.support@gmail.com">Support</a>
    <a href="https://www.facebook.com/share/1DGKfvGo9b/" target="_blank" rel="noopener">Facebook</a>
  </footer>
</div>

<div class="error-toast" id="error-toast"></div>

<script>
  const SUPABASE_URL = 'https://iutcgogmxhaqgaxkznxu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(window.location.search);
  const isParent = params.get('mode') === 'parent';

  let history = [];   // { role, content }[]
  let childData = null;
  let isWaiting = false;

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('chat-messages');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send-btn');
  const titleEl    = document.getElementById('chat-title');
  const subtitleEl = document.getElementById('chat-subtitle');
  const badgeEl    = document.getElementById('mode-badge');
  const avatarEl   = document.getElementById('chat-avatar');

  function goBack() {
    if (isParent) window.location.href = 'parent-dashboard.html';
    else          window.location.href = 'dashboard.html';
  }

  // ── Append a message bubble ───────────────────────────────────────────────────
  function appendMsg(role, text) {
    const isUser = role === 'user';
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'star'}`;

    const av = document.createElement('div');
    av.className = `msg-avatar ${isUser ? 'user-av' : 'star'}`;
    av.textContent = isUser ? '👤' : (isParent ? '🎓' : '⭐');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (isUser) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = marked.parse(text);
    }

    div.appendChild(av);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing-indicator';

    const av = document.createElement('div');
    av.className = 'msg-avatar star';
    av.textContent = isParent ? '🎓' : '⭐';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    div.appendChild(av);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showError(msg) {
    const el = document.getElementById('error-toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ── Starter chips ─────────────────────────────────────────────────────────────
  const CHIPS = [
    '💡 Help me with fractions',
    '✏️ What is a conjunction?',
    '🔢 How do I find a percentage?',
    '📝 Exam day advice',
  ];

  function addStarterChips() {
    const row = document.createElement('div');
    row.className = 'starter-chips';
    row.id = 'starter-chips';
    CHIPS.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'starter-chip';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        inputEl.value = label;
        removeStarterChips();
        sendMessage();
      });
      row.appendChild(btn);
    });
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeStarterChips() {
    document.getElementById('starter-chips')?.remove();
  }

  // ── Send a message ────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isWaiting) return;

    removeStarterChips();

    isWaiting = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMsg('user', text);
    showTyping();

    try {
      const token = (await sb.auth.getSession()).data.session?.access_token;
      const res = await fetch('/api/star-chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        },
        body: JSON.stringify({
          message: text,
          history,
          mode: isParent ? 'parent' : 'student',
          childData,
        }),
      });

      const data = await res.json();
      hideTyping();

      if (!res.ok || !data.reply) {
        showError('Something went wrong. Please try again.');
        return;
      }

      appendMsg('assistant', data.reply);

      // Update history (keep last 10 turns = 20 messages)
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      hideTyping();
      showError('Connection error. Please check your internet and try again.');
    } finally {
      isWaiting = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Input events ──────────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Weeks to exam calculator ──────────────────────────────────────────────────
  function calcWeeksToExam(examYear) {
    if (!examYear) return null;
    // Transfer test is sat in mid-November each year
    const examDate = new Date(parseInt(examYear), 10, 15); // Nov 15
    const now = new Date();
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const weeks = Math.round((examDate - now) / msPerWeek);
    return weeks > 0 ? weeks : null;
  }

  // ── Fetch parent child data from Supabase ─────────────────────────────────────
  async function fetchChildData(userId) {
    const loading = document.createElement('div');
    loading.className = 'context-loading';
    loading.id = 'ctx-loading';
    loading.textContent = 'Loading your child\'s data…';
    messagesEl.appendChild(loading);

    try {
      // profiles (name + exam_year)
      const { data: profile } = await sb
        .from('profiles')
        .select('name, exam_year')
        .eq('id', userId)
        .maybeSingle();

      const childName  = profile?.name ? profile.name.split(' ')[0] : null;
      const examYear   = profile?.exam_year ?? null;
      const weeksToExam = calcWeeksToExam(examYear);

      // progress_summary
      const { data: ps } = await sb
        .from('progress_summary')
        .select('last_score, topics_to_review')
        .eq('id', userId)
        .maybeSingle();

      // sessions count
      const { count: sessionsCount } = await sb
        .from('sessions')
        .select('id', { count: 'exact', head: true })
        .eq('user_id', userId);

      // topic accuracy from question_results
      const { data: qr } = await sb
        .from('question_results')
        .select('topic, correct')
        .eq('user_id', userId);

      // Aggregate by topic
      const topicMap = {};
      (qr || []).forEach(r => {
        if (!r.topic) return;
        if (!topicMap[r.topic]) topicMap[r.topic] = { correct: 0, total: 0 };
        topicMap[r.topic].total++;
        if (r.correct) topicMap[r.topic].correct++;
      });

      const topicAccuracy = Object.entries(topicMap)
        .filter(([, v]) => v.total >= 3)
        .map(([topic, v]) => ({
          topic,
          correct: v.correct,
          total: v.total,
          accuracy: Math.round((v.correct / v.total) * 100),
        }))
        .sort((a, b) => a.accuracy - b.accuracy);

      const weakTopics = (ps?.topics_to_review || []).length > 0
        ? ps.topics_to_review
        : topicAccuracy.filter(t => t.accuracy < 60).map(t => t.topic);

      childData = {
        childName,
        examYear,
        weeksToExam,
        lastScore:     ps?.last_score ?? null,
        sessionsCount: sessionsCount ?? 0,
        weakTopics,
        topicAccuracy,
      };

    } catch (err) {
      console.warn('[star-chat] Could not fetch child data:', err.message);
      childData = null;
    } finally {
      document.getElementById('ctx-loading')?.remove();
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  async function init() {
    const { data: authData, error: authErr } = await sb.auth.getSession();
    if (authErr || !authData?.session) {
      window.location.href = 'login.html';
      return;
    }

    const userId = authData.session.user.id;

    if (isParent) {
      titleEl.textContent   = 'STAR Parent Advisor';
      subtitleEl.textContent = 'Personalised advice for your child\'s transfer test prep';
      avatarEl.textContent  = '🎓';
      badgeEl.textContent   = 'Parent';
      badgeEl.className     = 'nav-mode-badge parent';
      document.title = 'STAR – Parent Advisor';
      inputEl.placeholder = 'Ask for advice about your child\'s transfer test preparation…';

      await fetchChildData(userId);

      // Greeting for parent mode
      const childFirstName = childData?.childName || 'your child';
      const greeting = childData?.lastScore != null
        ? `Hi! I'm STAR Parent Advisor. I can see ${childFirstName} has completed ${childData.sessionsCount} session${childData.sessionsCount !== 1 ? 's' : ''} with an overall score of ${childData.lastScore}%. How can I help you support their transfer test preparation today?`
        : `Hi! I'm STAR Parent Advisor. I'm here to help you support ${childFirstName}'s transfer test preparation. What would you like to know?`;

      appendMsg('assistant', greeting);
      addStarterChips();
    } else {
      // Student greeting — read the ACTIVE child's profile. These are parent
      // accounts with child selection, so the active child is selectedChildId
      // (localStorage), NOT the session user id. Fall back to the session id
      // for direct student logins.
      const profileId = localStorage.getItem('selectedChildId') || userId;
      const { data: profile } = await sb
        .from('profiles')
        .select('name, year_group')
        .eq('id', profileId)
        .maybeSingle();

      const firstName = (profile?.name || '').split(' ')[0] || 'there';
      childData = { childName: firstName, yearGroup: profile?.year_group || null };

      appendMsg('assistant',
        `Hi ${firstName}! I'm STAR, your transfer test tutor. 🌟 I'm here to help you with anything about the exam — maths, English, exam tips, or just to explain something you're stuck on. What would you like help with today?`
      );
      addStarterChips();
    }

    inputEl.focus();
  }

  init();
</script>
</body>
</html>
