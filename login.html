<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cookie Consent + GA4 (loads GA only if accepted) -->
  <script src="cookie-consent.js"></script>
  <style>
    :root {
      --orange: #FF6D00; --orange-dark: #E65100; --orange-light: #FF9E40;
      --yellow: #FFD54F; --yellow-dark: #F9A825;
      --cream: #FFF9E6; --cream-border: #F0E0C0;
      --text-dark: #333333; --text-mid: #666666; --text-light: #999999;
      --card-border: #E8D8B8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--cream);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--text-dark);
      display: flex; flex-direction: column;
      min-height: 100vh;
    }

    /* ── Nav ── */
    .top-nav {
      background: var(--orange);
      box-shadow: 0 4px 0 var(--orange-dark);
      height: 64px; display: flex; align-items: center;
      padding: 0 24px; flex-shrink: 0;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-star {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .nav-logo-wordmark { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
    .nav-logo-name { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: .04em; }
    .nav-logo-sub { font-size: .48rem; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .18em; text-transform: uppercase; }

    /* ── Main layout ── */
    .main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      width: 100%; max-width: 440px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border: 2px solid var(--card-border);
    }

    /* ── Logo block ── */
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 16px;
      background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-dark);
      font-size: 2rem; margin-bottom: 12px;
    }
    .logo h1 {
      font-size: 1.5rem; font-weight: 900; color: var(--text-dark); margin-bottom: 4px;
    }
    .logo p { color: var(--text-mid); font-size: .88rem; font-weight: 600; }

    /* ── Google button ── */
    .google-btn {
      width: 100%; padding: 13px;
      border: 2px solid #e0e0e0; border-radius: 12px;
      background: #fff; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-size: .95rem; font-weight: 700;
      color: var(--text-dark);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 20px; transition: border-color .2s, box-shadow .2s;
    }
    .google-btn:hover { border-color: var(--orange); box-shadow: 0 2px 8px rgba(255,109,0,.15); }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #e0e0e0; }
    .divider span { color: var(--text-light); font-size: .82rem; font-weight: 700; }

    /* ── Inputs ── */
    input, select {
      width: 100%; padding: 13px 16px;
      border: 2px solid var(--card-border); border-radius: 10px;
      font-size: .95rem; margin-bottom: 12px;
      outline: none; font-family: 'Nunito', sans-serif; font-weight: 600;
      color: var(--text-dark); background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,109,0,.12);
    }
    input::placeholder { color: #bbb; font-weight: 400; }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%; padding: 14px;
      background: var(--orange); color: #fff;
      border: none; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-size: .95rem; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      cursor: pointer; margin-bottom: 16px;
      box-shadow: 0 4px 0 var(--orange-dark);
      transition: transform .15s, box-shadow .15s;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--orange-dark); }
    .submit-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-dark); }
    .submit-btn:disabled { background: #FFAB76; box-shadow: 0 4px 0 #D4845A; cursor: not-allowed; }

    /* ── Toggle text ── */
    .toggle-text { text-align: center; color: var(--text-mid); font-size: .85rem; font-weight: 600; }
    .toggle-text a { color: var(--orange); font-weight: 800; cursor: pointer; text-decoration: none; }
    .toggle-text a:hover { text-decoration: underline; }

    /* ── Messages ── */
    .message { border-radius: 10px; padding: 12px 14px; font-size: .85rem; font-weight: 700; margin-bottom: 16px; }
    .message.error   { background: #FFF3F3; border: 2px solid #FFCDD2; color: #C62828; }
    .message.success { background: #F0FFF4; border: 2px solid #C6F6D5; color: #276749; }

    .signup-fields { display: none; }
    .signup-fields.visible { display: block; }

    /* ── Footer ── */
    footer {
      padding: 20px; display: flex; justify-content: center; gap: 20px;
      flex-wrap: wrap; border-top: 2px solid var(--cream-border);
      flex-shrink: 0;
    }
    footer a {
      font-size: .74rem; font-weight: 700; color: var(--text-light);
      text-decoration: none; transition: color .2s;
    }
    footer a:hover { color: var(--orange); }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-star">⭐</div>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;TUTOR</span>
    </div>
  </a>
</nav>

<div class="main">
  <div class="card">

    <div class="logo">
      <div class="logo-badge">⭐</div>
      <h1>Welcome back!</h1>
      <p>Sign in to continue your transfer test prep</p>
    </div>

    <button class="google-btn" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><hr><span>or</span><hr></div>

    <div id="message" class="message" style="display:none"></div>

    <div class="signup-fields" id="signupFields">
      <input type="text" id="nameInput" placeholder="Your first name" />
      <select id="yearGroup">
        <option value="P6">P6 — Building foundations</option>
        <option value="P7">P7 — Exam ready</option>
      </select>
    </div>

    <input type="email" id="emailInput" placeholder="Email address" />
    <input type="password" id="passwordInput" placeholder="Password (min 6 characters)" />

    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">🔐 Log In</button>

    <p class="toggle-text">
      Don't have an account? <a onclick="toggleMode()">Sign up free</a>
    </p>

  </div>
</div>

<footer>
  <a href="mailto:staraitutor.support@gmail.com">Support</a>
  <a href="https://www.facebook.com/share/1DGKfvGo9b/" target="_blank" rel="noopener">Facebook</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="terms.html">Terms of Service</a>
</footer>

<script>
  const { createClient } = supabase
  const client = createClient(
    'https://iutcgogmxhaqgaxkznxu.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
  )

  let isSignUp = false

  /* ══════════════════════════════════════
     SMART REDIRECT
     1. Check for children (parent_id = user.id)
        → found: child-selector.html
     2. No children → check own profile (maybeSingle — null if missing, no 406)
        → onboarded: study.html
        → no profile / not onboarded: onboarding.html
  ══════════════════════════════════════ */
  async function smartRedirect(userId) {
    try {
      // Step 1 — children check runs first
      const childrenResult = await client.from('profiles').select('id').eq('parent_id', userId).limit(5)

      if (!childrenResult.error && childrenResult.data && childrenResult.data.length > 0) {
        window.location.href = 'parent-dashboard.html'
        return
      }

      // Step 2 — own profile check (maybeSingle returns null when row absent, never 406)
      const profileResult = await client.from('profiles').select('onboarded').eq('id', userId).maybeSingle()

      if (!profileResult.error && profileResult.data?.onboarded === true) {
        // Direct student (no children) — store own ID so student pages can read selectedChildId
        localStorage.setItem('selectedChildId', userId)
        window.location.href = 'study.html'
      } else {
        window.location.href = 'onboarding.html'
      }
    } catch (err) {
      console.error('[smartRedirect] caught error:', err.message)
      window.location.href = 'onboarding.html'
    }
  }

  /* ══════════════════════════════════════
     TOGGLE LOGIN / SIGNUP
  ══════════════════════════════════════ */
  function toggleMode() {
    isSignUp = !isSignUp
    document.getElementById('signupFields').classList.toggle('visible', isSignUp)
    document.getElementById('submitBtn').textContent = isSignUp ? '🚀 Create Account' : '🔐 Log In'
    document.querySelector('.toggle-text').innerHTML = isSignUp
      ? 'Already have an account? <a onclick="toggleMode()">Log in</a>'
      : 'Don\'t have an account? <a onclick="toggleMode()">Sign up free</a>'
    clearMessage()
  }

  /* ══════════════════════════════════════
     GOOGLE LOGIN
     Redirects back to login.html after OAuth
     so smartRedirect can run here
  ══════════════════════════════════════ */
  async function loginWithGoogle() {
    showMessage('⏳ Redirecting to Google...', 'success')
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/login.html'
      }
    })
    if (error) showMessage('⚠️ ' + error.message, 'error')
  }

  /* ══════════════════════════════════════
     EMAIL LOGIN / SIGNUP
  ══════════════════════════════════════ */
  async function handleSubmit() {
    const email    = document.getElementById('emailInput').value.trim()
    const password = document.getElementById('passwordInput').value
    const btn      = document.getElementById('submitBtn')

    if (!email || !password) {
      showMessage('⚠️ Please enter your email and password.', 'error')
      return
    }

    btn.disabled = true
    btn.textContent = '⏳ Please wait...'
    clearMessage()

    if (isSignUp) {
      const name      = document.getElementById('nameInput').value.trim()
      const yearGroup = document.getElementById('yearGroup').value

      const { error } = await client.auth.signUp({
        email, password,
        options: {
          data: { full_name: name, year_group: yearGroup },
          emailRedirectTo: window.location.origin + '/login.html'
        }
      })

      if (error) {
        showMessage('⚠️ ' + error.message, 'error')
      } else {
        showMessage('✅ Check your email to confirm your account, then come back to log in!', 'success')
      }

    } else {
      const { data, error } = await client.auth.signInWithPassword({ email, password })
      if (error) {
        showMessage('⚠️ ' + error.message, 'error')
      } else if (data?.user) {
        await smartRedirect(data.user.id)
      }
    }

    btn.disabled = false
    btn.textContent = isSignUp ? '🚀 Create Account' : '🔐 Log In'
  }

  /* ══════════════════════════════════════
     HELPERS
  ══════════════════════════════════════ */
  function showMessage(text, type) {
    const el = document.getElementById('message')
    el.textContent = text
    el.className = 'message ' + type
    el.style.display = 'block'
  }

  function clearMessage() {
    document.getElementById('message').style.display = 'none'
  }

  /* ══════════════════════════════════════
     OAUTH ERROR SURFACE
     When Google/Supabase redirect back with
     an error in the URL hash, show it rather
     than leaving the user on a blank page.
  ══════════════════════════════════════ */
  ;(function checkOAuthError() {
    const hash = new URLSearchParams(window.location.hash.slice(1))
    const msg  = hash.get('error_description') || hash.get('error')
    if (msg) showMessage('⚠️ Sign-in failed: ' + msg, 'error')
  })()

  /* ══════════════════════════════════════
     SESSION DETECTION
     onAuthStateChange is used instead of a
     one-shot getSession() call so that the
     OAuth callback session (which is set
     asynchronously from the URL hash) is
     reliably detected.

     SIGNED_IN   — fires after OAuth return or email login
     INITIAL_SESSION — fires on page load when a session
                       already exists in storage
  ══════════════════════════════════════ */
  let _redirecting = false
  client.auth.onAuthStateChange(async (event, session) => {
    if (_redirecting) return
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user) {
      _redirecting = true
      await smartRedirect(session.user.id)
    }
  })
</script>
</body>
</html>
