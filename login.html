<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR AI Tutor — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
  <script src="cookie-consent.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #FEF3E2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1A1A1A;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: #F97316;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1A1A1A;
      margin-bottom: 6px;
      text-align: center;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6B7280;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      background: #fff;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1A1A1A;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }

    .google-btn:hover {
      border-color: #D1D5DB;
      background: #F9FAFB;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .divider span {
      font-size: 0.8rem;
      color: #9CA3AF;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: #1A1A1A;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #F97316;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: #F97316;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
      letter-spacing: -0.2px;
    }

    .login-btn:hover { background: #EA6C0A; }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { background: #D1D5DB; cursor: not-allowed; }

    .message {
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .message.error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #DC2626;
    }

    .message.success {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
    }

    .signup-link {
      text-align: center;
      font-size: 0.86rem;
      color: #6B7280;
    }

    .signup-link a {
      color: #F97316;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover { text-decoration: underline; }

    .pw-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .pw-wrap input[type="password"],
    .pw-wrap input[type="text"] {
      margin-bottom: 0;
      padding-right: 48px;
    }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9CA3AF;
      line-height: 0;
    }
    .pw-toggle:hover { color: #6B7280; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.82rem;
      color: #F97316;
      font-weight: 600;
      cursor: pointer;
      margin-top: -10px;
      margin-bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .forgot-link:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<div class="card">
  <a href="index.html" class="logo">⭐ STAR AI Tutor</a>

  <h1>Welcome back!</h1>
  <p class="subtitle">Sign in to continue your transfer test prep</p>

  <button class="google-btn" onclick="loginWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider"><span>or</span></div>

  <div class="message" id="message"></div>

  <label for="emailInput">Email address</label>
  <input type="email" id="emailInput" placeholder="parent@example.com" autocomplete="email"/>

  <label for="passwordInput">Password</label>
  <div class="pw-wrap">
    <input type="password" id="passwordInput" placeholder="Your password" autocomplete="current-password"/>
    <button class="pw-toggle" type="button" onclick="togglePassword('passwordInput', this)" aria-label="Show or hide password">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  <button class="forgot-link" type="button" onclick="handleForgotPassword()">Forgot your password?</button>

  <button class="login-btn" id="loginBtn" onclick="handleLogin()">Log In</button>

  <div class="signup-link">
    Don't have an account? <a href="signup.html">Sign up free</a>
  </div>
</div>

<script>
  const { createClient } = supabase
  const client = createClient(
    'https://iutcgogmxhaqgaxkznxu.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
  )

  /* ══════════════════════════════════════
     GUEST SESSION SYNC
     If the user did Mini Mocks before signing up, their results are in
     localStorage (star_sessions). Sync them to Supabase once, then
     clear the guest keys so future logins skip this step.
  ══════════════════════════════════════ */
  async function syncGuestSessions(accessToken) {
    const guestDone = parseInt(localStorage.getItem('guest_sprints_done') || '0', 10)
    console.log('[syncGuestSessions] guest_sprints_done:', guestDone)
    if (guestDone === 0) return

    const sessions = JSON.parse(localStorage.getItem('star_sessions') || '[]')
    console.log('[syncGuestSessions] star_sessions length:', sessions.length)
    if (sessions.length === 0) return

    try {
      const res = await fetch('/api/sync-guest-sessions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({ sessions }),
      })
      if (res.ok) {
        ;['guest_sprints_done', 'star_sessions', 'star_mastery', 'star_toReview',
          'star_last_score', 'star_last_track', 'star_last_name', 'star_video_log'
        ].forEach(k => localStorage.removeItem(k))
        localStorage.setItem('star_needs_baseline', '1')
        console.log('[syncGuestSessions] ✅ synced', sessions.length, 'sessions — star_needs_baseline set')
      } else {
        const text = await res.text()
        console.error('[syncGuestSessions] API non-ok:', res.status, text.slice(0, 200))
      }
    } catch (err) {
      console.error('[syncGuestSessions] failed (non-fatal):', err.message)
    }
  }

  async function smartRedirect(userId, accessToken) {
    try {
      if (accessToken) await syncGuestSessions(accessToken)

      const childrenResult = await client.from('profiles').select('id').eq('parent_id', userId).limit(5)

      if (!childrenResult.error && childrenResult.data && childrenResult.data.length > 0) {
        window.location.href = 'parent-dashboard.html'
        return
      }

      const profileResult = await client.from('profiles').select('onboarded').eq('id', userId).maybeSingle()

      if (!profileResult.error && profileResult.data?.onboarded === true) {
        localStorage.setItem('selectedChildId', userId)
        window.location.href = 'dashboard.html'
      } else {
        window.location.href = 'onboarding.html'
      }
    } catch (err) {
      console.error('[smartRedirect] caught error:', err.message)
      window.location.href = 'onboarding.html'
    }
  }

  /* ══════════════════════════════════════
     GOOGLE LOGIN
  ══════════════════════════════════════ */
  async function loginWithGoogle() {
    showMessage('Redirecting to Google…', 'success')
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/login.html' }
    })
    if (error) showMessage(error.message, 'error')
  }

  /* ══════════════════════════════════════
     EMAIL LOGIN
  ══════════════════════════════════════ */
  async function handleLogin() {
    const email    = document.getElementById('emailInput').value.trim()
    const password = document.getElementById('passwordInput').value
    const btn      = document.getElementById('loginBtn')

    if (!email || !password) {
      showMessage('Please enter your email and password.', 'error')
      return
    }

    btn.disabled    = true
    btn.textContent = 'Signing in…'
    document.getElementById('message').style.display = 'none'

    const { data, error } = await client.auth.signInWithPassword({ email, password })

    if (error) {
      showMessage(error.message, 'error')
      btn.disabled    = false
      btn.textContent = 'Log In'
      return
    }

    if (data?.user) {
      localStorage.setItem('star_last_email', email);
      await smartRedirect(data.user.id, data.session?.access_token)
    }
  }

  /* ══════════════════════════════════════
     HELPERS
  ══════════════════════════════════════ */
  function showMessage(text, type) {
    const el = document.getElementById('message')
    el.textContent = text
    el.className = 'message ' + type
    el.style.display = 'block'
  }

  /* ══════════════════════════════════════
     PRE-FILL & PERSONALISE
  ══════════════════════════════════════ */
  ;(function prefill() {
    const lastEmail = localStorage.getItem('star_last_email');
    const guestName = localStorage.getItem('star_guest_name');
    if (lastEmail) document.getElementById('emailInput').value = lastEmail;
    if (guestName) document.querySelector('.subtitle').textContent =
      'Hi ' + guestName + '! Sign in to save your results';
  })();

  /* ══════════════════════════════════════
     SHOW/HIDE PASSWORD
  ══════════════════════════════════════ */
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHiding = input.type === 'text';
    input.type = isHiding ? 'password' : 'text';
    btn.style.opacity = isHiding ? '1' : '0.5';
  }

  /* ══════════════════════════════════════
     FORGOT PASSWORD
  ══════════════════════════════════════ */
  async function handleForgotPassword() {
    const email = document.getElementById('emailInput').value.trim();
    if (!email) {
      showMessage('Enter your email address above first.', 'error');
      return;
    }
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html',
    });
    if (error) {
      showMessage(error.message, 'error');
    } else {
      showMessage('Password reset email sent — check your inbox.', 'success');
    }
  }

  ;(function checkOAuthError() {
    const hash = new URLSearchParams(window.location.hash.slice(1))
    const msg  = hash.get('error_description') || hash.get('error')
    if (msg) showMessage('Sign-in failed: ' + msg, 'error')
  })()

  /* ══════════════════════════════════════
     SESSION DETECTION (OAuth callback)
  ══════════════════════════════════════ */
  let _redirecting = false
  client.auth.onAuthStateChange(async (event, session) => {
    if (_redirecting) return
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user) {
      _redirecting = true
      await smartRedirect(session.user.id, session.access_token)
    }
  })

  document.getElementById('passwordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin()
  })
</script>

</body>
</html>
