<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --orange:       #F97316;
      --orange-dark:  #EA6C0A;
      --orange-light: #FB923C;
      --yellow:       #F59E0B;
      --yellow-dark:  #D97706;
      --cream:        #FEF3E2;
      --cream-border: #F0E0C0;
      --text-dark:    #333333;
      --text-mid:     #666666;
      --text-light:   #999999;
      --card-border:  #E8D8B8;
      --green:        #58CC02;
      --green-dark:   #46A302;
      --red:          #EF4444;
      --amber:        #F59E0B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      background: var(--cream);
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--text-dark);
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* ── Nav ── */
    .top-nav {
      background: var(--orange);
      box-shadow: 0 4px 0 var(--orange-dark);
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-star {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .nav-logo-wordmark { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
    .nav-logo-name { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: .04em; }
    .nav-logo-sub  { font-size: .48rem; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .18em; text-transform: uppercase; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; border: none;
      font-family: 'Nunito', sans-serif; transition: all .15s; text-decoration: none; display: inline-block;
    }
    .nav-btn-ghost   { background: rgba(255,255,255,.2); color: #fff; border: 2px solid rgba(255,255,255,.4); }
    .nav-btn-ghost:hover { background: rgba(255,255,255,.32); }
    .nav-btn-danger  { background: rgba(239,68,68,.2); color: #fff; border: 2px solid rgba(239,68,68,.4); }
    .nav-btn-danger:hover { background: rgba(239,68,68,.35); }

    /* ── Wrapper ── */
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
    }
    .ph-eyebrow {
      font-size: .68rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
      color: var(--orange); margin-bottom: 6px;
    }
    .ph-title { font-size: 1.75rem; font-weight: 900; color: var(--text-dark); line-height: 1.2; }
    .ph-sub   { font-size: .88rem; color: var(--text-mid); margin-top: 5px; }
    .btn-add-child {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 12px;
      background: var(--orange); color: #fff;
      font-family: 'Nunito', sans-serif; font-size: .82rem; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 4px 0 var(--orange-dark);
      transition: transform .15s, box-shadow .15s; flex-shrink: 0;
    }
    .btn-add-child:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--orange-dark); }
    .btn-add-child:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-dark); }

    /* ── Status ── */
    .status-msg { text-align: center; color: var(--text-mid); padding: 60px 0; font-size: .95rem; }

    /* ── Children grid ── */
    .children-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }
    @media (max-width: 520px) { .children-grid { grid-template-columns: 1fr; } }

    /* ── Child card ── */
    .child-card {
      background: #fff;
      border: 2px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .child-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.11); transform: translateY(-2px); }

    /* Card header */
    .card-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 22px 16px;
      border-bottom: 2px solid var(--cream-border);
    }
    .child-avatar {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--orange), var(--orange-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 12px rgba(255,109,0,.25);
    }
    .card-header-meta { flex: 1; min-width: 0; }
    .child-name {
      font-size: 1.1rem; font-weight: 900; color: var(--text-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .year-badge {
      display: inline-flex; align-items: center;
      padding: 3px 11px; border-radius: 99px;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
      background: #FFF3E0; color: var(--orange);
      border: 1px solid rgba(255,109,0,.25);
    }
    .last-active { font-size: .72rem; color: var(--text-light); font-weight: 700; }

    /* Stats strip */
    .card-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 14px 22px; gap: 0;
      border-bottom: 2px solid var(--cream-border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-item + .stat-item { border-left: 2px solid var(--cream-border); padding-left: 20px; }
    .stat-label { font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--text-light); }
    .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--text-dark); line-height: 1.1; }
    .stat-value.good  { color: var(--green); }
    .stat-value.ok    { color: var(--orange); }
    .stat-value.needs { color: var(--red); }
    .stat-sub { font-size: .7rem; color: var(--text-light); font-weight: 700; }

    /* Topics */
    .card-topics {
      padding: 14px 22px;
      border-bottom: 2px solid var(--cream-border);
      min-height: 66px;
    }
    .topics-label { font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }
    .topics-tags  { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 99px;
      font-size: .72rem; font-weight: 700;
    }
    .topic-tag.weak    { background: rgba(245,158,11,.1); color: #B45309; border: 1px solid rgba(245,158,11,.3); }
    .topic-tag.strong  { background: rgba(88,204,2,.1);   color: #2D7D00; border: 1px solid rgba(88,204,2,.3); }
    .topic-tag.no-data { background: #F5F5F5; color: var(--text-light); border: 1px solid #E0E0E0; }

    /* Action buttons */
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 22px 18px; }
    .btn-action {
      padding: 11px 14px; border-radius: 10px;
      font-family: 'Nunito', sans-serif; font-size: .78rem; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      border: none; cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .btn-action-primary {
      background: var(--orange); color: #fff;
      box-shadow: 0 3px 0 var(--orange-dark);
    }
    .btn-action-primary:hover  { transform: translateY(-1px); box-shadow: 0 4px 0 var(--orange-dark); }
    .btn-action-primary:active { transform: translateY(1px);  box-shadow: 0 1px 0 var(--orange-dark); }
    .btn-action-secondary {
      background: #fff; color: var(--text-mid);
      border: 2px solid var(--card-border);
    }
    .btn-action-secondary:hover { background: var(--cream); color: var(--text-dark); border-color: var(--cream-border); }

    /* AI Insights */
    .insights-toggle {
      width: 100%; padding: 11px 22px;
      background: #FFF9F0; border: none; border-top: 2px solid var(--cream-border);
      font-family: 'Nunito', sans-serif; font-size: .75rem; font-weight: 800;
      color: var(--orange); letter-spacing: .05em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: background .15s;
    }
    .insights-toggle:hover { background: var(--cream); }
    .insights-panel {
      padding: 16px 22px; background: #FAFAF8;
      border-top: 1px solid var(--cream-border);
    }
    .insight-group { margin-bottom: 14px; }
    .insight-group:last-child { margin-bottom: 0; }
    .insight-group-title {
      font-size: .6rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-light); margin-bottom: 7px;
    }
    .insight-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #F0ECE4;
    }
    .insight-row:last-child { border-bottom: none; }
    .insight-name { font-size: .81rem; font-weight: 700; color: var(--text-dark); }
    .insight-badge {
      flex-shrink: 0; font-size: .7rem; font-weight: 800;
      padding: 3px 10px; border-radius: 99px;
    }
    .badge-weak      { background: #FEE2E2; color: #B91C1C; }
    .badge-improving { background: #D1FAE5; color: #065F46; }
    .badge-strong    { background: #DCFCE7; color: #166534; }

    /* Empty state */
    .empty-state {
      max-width: 480px; margin: 60px auto; text-align: center;
      background: #fff; border: 2px solid var(--card-border);
      border-radius: 20px; padding: 48px 36px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
    }
    .empty-icon  { font-size: 3rem; margin-bottom: 14px; }
    .empty-title { font-size: 1.2rem; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; }
    .empty-sub   { font-size: .88rem; color: var(--text-mid); line-height: 1.6; margin-bottom: 24px; }
  </style>
</head>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iutcgogmxhaqgaxkznxu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
);

const AVATARS   = ['👦','👧','🧒','🌟','⭐','📚'];
const TOPIC_MAP = {
  punctuation:           'Punctuation',
  grammar:               'Grammar',
  spelling:              'Spelling',
  vocabulary:            'Vocabulary',
  comprehension_mc:      'Comprehension',
  comprehension_written: 'Comprehension (written)',
  arithmetic:            'Arithmetic',
  geometry:              'Geometry',
  fractions_decimals:    'Fractions',
  measurement:           'Measurement',
  statistics:            'Statistics',
  algebra_sequences:     'Algebra',
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}

function timeAgo(iso) {
  if (!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (d === 0) return 'Active today';
  if (d === 1) return 'Active yesterday';
  if (d < 7)  return `Active ${d} days ago`;
  const w = Math.floor(d / 7);
  if (w < 8)  return `Active ${w} week${w > 1 ? 's' : ''} ago`;
  return 'Active ' + new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function scoreClass(pct) {
  return pct >= 75 ? 'good' : pct >= 50 ? 'ok' : 'needs';
}

function goToPage(childId, page) {
  localStorage.setItem('selectedChildId', childId);
  window.location.href = page;
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

function topicLabel(raw) {
  return TOPIC_MAP[raw] || raw.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function toggleInsights(childId) {
  const panel   = document.getElementById('insights-' + childId);
  const chevron = document.getElementById('chevron-' + childId);
  if (!panel) return;
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  if (chevron) chevron.textContent = open ? '▼' : '▲';
}

function computeInsights(sessions, qr) {
  if (sessions.length < 3 || qr.length === 0) return null;

  // Overall per-topic accuracy
  const topicMap = {};
  qr.forEach(r => {
    if (!r.topic) return;
    if (!topicMap[r.topic]) topicMap[r.topic] = { c: 0, t: 0 };
    topicMap[r.topic].t++;
    if (r.correct) topicMap[r.topic].c++;
  });

  const allTopics = Object.entries(topicMap)
    .filter(([, v]) => v.t >= 3)
    .map(([name, v]) => ({ name, pct: Math.round(v.c / v.t * 100) }));

  const needsPractice = allTopics.filter(t => t.pct < 70).sort((a, b) => a.pct - b.pct).slice(0, 3);
  const strongAreas   = allTopics.filter(t => t.pct >= 85).sort((a, b) => b.pct - a.pct).slice(0, 3);

  // Improving: compare last 2 sessions vs all previous
  const sorted    = [...sessions].sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
  const recentIds = new Set(sorted.slice(0, 2).map(s => s.id));
  const prevIds   = new Set(sorted.slice(2).map(s => s.id));

  const improving = [];
  if (prevIds.size >= 1) {
    const rec = {}, prev = {};
    qr.forEach(r => {
      if (!r.topic || !r.session_id) return;
      const bucket = recentIds.has(r.session_id) ? rec : prevIds.has(r.session_id) ? prev : null;
      if (!bucket) return;
      if (!bucket[r.topic]) bucket[r.topic] = { c: 0, t: 0 };
      bucket[r.topic].t++;
      if (r.correct) bucket[r.topic].c++;
    });
    Object.entries(rec).forEach(([topic, rv]) => {
      if (rv.t < 2) return;
      const pv = prev[topic];
      if (!pv || pv.t < 2) return;
      const rPct = Math.round(rv.c / rv.t * 100);
      const pPct = Math.round(pv.c / pv.t * 100);
      if (rPct - pPct >= 10) improving.push({ name: topic, prevPct: pPct, nowPct: rPct });
    });
    improving.sort((a, b) => (b.nowPct - b.prevPct) - (a.nowPct - a.prevPct));
  }

  if (!needsPractice.length && !improving.length && !strongAreas.length) return null;
  return { needsPractice, improving, strongAreas };
}

function buildInsightsHtml(insights, childId) {
  if (!insights) return '';
  const { needsPractice, improving, strongAreas } = insights;

  const rows = (items, badgeClass, fmt) =>
    items.map(t => `
      <div class="insight-row">
        <span class="insight-name">${esc(topicLabel(t.name))}</span>
        <span class="insight-badge ${badgeClass}">${fmt(t)}</span>
      </div>`).join('');

  const needsHtml = needsPractice.length ? `
    <div class="insight-group">
      <div class="insight-group-title">📉 Needs Practice</div>
      ${rows(needsPractice, 'badge-weak', t => `${t.pct}% accuracy`)}
    </div>` : '';

  const improvingHtml = improving.length ? `
    <div class="insight-group">
      <div class="insight-group-title">📈 Improving</div>
      ${rows(improving, 'badge-improving', t => `${t.prevPct}% → ${t.nowPct}% ↗`)}
    </div>` : '';

  const strongHtml = strongAreas.length ? `
    <div class="insight-group">
      <div class="insight-group-title">💪 Strong Areas</div>
      ${rows(strongAreas, 'badge-strong', t => `${t.pct}% accuracy`)}
    </div>` : '';

  return `
    <button class="insights-toggle" onclick="toggleInsights('${childId}')">
      📊 AI Insights
      <span class="insights-chevron" id="chevron-${childId}">▼</span>
    </button>
    <div class="insights-panel" id="insights-${childId}" style="display:none">
      ${needsHtml}${improvingHtml}${strongHtml}
    </div>`;
}

function buildCard(child, idx, sessions, progress, insightsHtml = '', subscribed = true) {
  const avatar     = AVATARS[idx % AVATARS.length];
  const yearLabel  = child.year_group === 'P7' ? 'P7' : 'P6';
  const lastActive = timeAgo(progress?.last_session_at ?? sessions[0]?.completed_at);
  const total      = sessions.length;

  const avgPct = total > 0
    ? Math.round(sessions.reduce((a, s) => a + (s.total_questions > 0 ? s.score / s.total_questions * 100 : 0), 0) / total)
    : null;

  const weakTopics = (progress?.topics_to_review || [])
    .map(t => TOPIC_MAP[t.topic] || t.topic)
    .filter((v, i, a) => a.indexOf(v) === i);

  let topicsHtml;
  if (total === 0) {
    topicsHtml = `<span class="topic-tag no-data">No sprints yet</span>`;
  } else if (weakTopics.length === 0) {
    topicsHtml = `<span class="topic-tag strong">✅ All topics strong</span>`;
  } else {
    topicsHtml = weakTopics.slice(0, 6).map(t => `<span class="topic-tag weak">⚠️ ${esc(t)}</span>`).join('');
    if (weakTopics.length > 6) topicsHtml += `<span class="topic-tag no-data">+${weakTopics.length - 6} more</span>`;
  }

  const avgHtml = avgPct !== null
    ? `<span class="stat-value ${scoreClass(avgPct)}">${avgPct}%</span><div class="stat-sub">${avgPct >= 75 ? 'Great work' : avgPct >= 50 ? 'Building up' : 'Needs practice'}</div>`
    : `<span class="stat-value" style="font-size:1.1rem;color:var(--text-light)">—</span><div class="stat-sub">No data yet</div>`;

  return `
    <div class="child-card">
      <div class="card-header">
        <div class="child-avatar">${avatar}</div>
        <div class="card-header-meta">
          <div class="child-name">${esc(child.name || 'Child')}</div>
          <div class="card-meta-row">
            <span class="year-badge">${yearLabel}</span>
            ${lastActive ? `<span class="last-active">· ${lastActive}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="card-stats">
        <div class="stat-item">
          <div class="stat-label">Sprints completed</div>
          <span class="stat-value">${total}</span>
          <div class="stat-sub">${total === 1 ? '1 session' : `${total} sessions`}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Average score</div>
          ${avgHtml}
        </div>
      </div>
      <div class="card-topics">
        <div class="topics-label">Topics to review</div>
        <div class="topics-tags">${topicsHtml}</div>
      </div>
      <div class="card-actions">
        <button class="btn-action ${subscribed ? 'btn-action-primary' : 'btn-action-secondary'}"
          onclick="window.location.href='${subscribed ? `study.html` : `pricing.html`}'">
          ${subscribed ? '▶ Start Sprint' : '🔒 Subscribe to Start'}</button>
        <button class="btn-action btn-action-secondary" onclick="goToPage('${child.id}','dashboard.html')">Go to Student Dashboard</button>
        <button class="btn-action btn-action-secondary"
          onclick="window.location.href='${subscribed ? `real-life-test.html?childId=${child.id}&year=${child.year_group}` : `pricing.html`}'">
          ${subscribed ? '📄 Print Test' : '🔒 Print Test'}</button>
      </div>
      ${insightsHtml}
    </div>`;
}

window.addEventListener('DOMContentLoaded', async () => {
  const { data: authData } = await sb.auth.getSession();
  if (!authData?.session?.user) { window.location.href = 'login.html'; return; }
  const parentId    = authData.session.user.id;
  const accessToken = authData.session.access_token;

  // Subscription check — gates session buttons
  let subscribed = false;
  try {
    const subRes = await fetch('/api/subscription?action=check', {
      headers: { 'Authorization': `Bearer ${accessToken}` },
    });
    if (subRes.ok) {
      const subData = await subRes.json();
      subscribed = subData.subscribed === true;
    }
  } catch (e) {
    console.error('[parent-dashboard] subscription check failed:', e.message);
  }

  // Lock header Print Test button for unsubscribed parents
  if (!subscribed) {
    const headerPrintBtn = document.querySelector('a[href="real-life-test.html"]');
    if (headerPrintBtn) headerPrintBtn.href = 'pricing.html';
  }

  // 1. Fetch own profile (child set up during onboarding lives here, not in a parent_id row)
  const { data: ownProfile } = await sb
    .from('profiles')
    .select('id, name, year_group')
    .eq('id', parentId)
    .single();

  // 2. Fetch additional children added via add-child.html
  const { data: children, error: childErr } = await sb
    .from('profiles')
    .select('id, name, year_group')
    .eq('parent_id', parentId)
    .order('name', { ascending: true });

  if (childErr) {
    document.getElementById('content').textContent = 'Error loading children. Please refresh.';
    console.error('[parent-dashboard] children error:', childErr.message);
    document.body.style.opacity = '1';
    return;
  }

  // Combine: own profile (if it has year_group from onboarding) + additional children
  const linkedChildren = children || [];
  const linkedIds = new Set(linkedChildren.map(c => c.id));
  const kids = [
    ...(ownProfile?.year_group && !linkedIds.has(ownProfile.id) ? [ownProfile] : []),
    ...linkedChildren,
  ];
  document.getElementById('ph-sub').textContent =
    kids.length === 0 ? 'No children linked yet.' :
    kids.length === 1 ? '1 child linked to your account.' :
    `${kids.length} children linked to your account.`;

  if (kids.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👨‍👩‍👧</div>
        <div class="empty-title">No children linked yet</div>
        <div class="empty-sub">Your child's details will appear here once your account is set up.</div>
        <a class="btn-add-child" href="add-child.html">+ Add a Child</a>
      </div>`;
    document.getElementById('content').className = '';
    document.body.style.opacity = '1';
    return;
  }

  const childIds = kids.map(c => c.id);

  // 2. Fetch sessions + progress via service-role API to bypass RLS
  //    (parent's anon token can't read children's session rows directly)
  const statsRes = await fetch('/api/get-parent-stats', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${accessToken}`,
    },
    body: JSON.stringify({ childIds }),
  });

  const stats = statsRes.ok ? await statsRes.json() : { sessions: [], progress: [], questionResults: [] };
  if (!statsRes.ok) console.error('[parent-dashboard] get-parent-stats error:', statsRes.status);

  const allSessions = stats.sessions        || [];
  const allProgress = stats.progress        || [];
  const allQR       = stats.questionResults || [];

  // 3. Group by child id
  const sessionsByChild = {};
  const progressByChild = {};
  const qrByChild       = {};
  childIds.forEach(id => { sessionsByChild[id] = []; qrByChild[id] = []; });
  allSessions.forEach(s => { if (sessionsByChild[s.user_id]) sessionsByChild[s.user_id].push(s); });
  allProgress.forEach(p => { progressByChild[p.user_id] = p; });
  allQR.forEach(r => { if (qrByChild[r.user_id]) qrByChild[r.user_id].push(r); });

  // 4. Render
  const grid = document.createElement('div');
  grid.className = 'children-grid';
  grid.innerHTML = kids.map((child, i) => {
    const childSessions = sessionsByChild[child.id] || [];
    const insights      = computeInsights(childSessions, qrByChild[child.id] || []);
    const insightsHtml  = buildInsightsHtml(insights, child.id);
    return buildCard(child, i, childSessions, progressByChild[child.id] || null, insightsHtml, subscribed);
  }).join('');
  document.getElementById('content').replaceWith(grid);
  document.body.style.opacity = '1';
});
</script>
</body>
</html>
