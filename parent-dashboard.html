<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR — Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cookie-consent.js"></script>
  <style>
    :root {
      --gold:        #C9A84C;
      --gold-light:  #E8C97A;
      --gold-dim:    rgba(201,168,76,0.14);
      --gold-dim2:   rgba(201,168,76,0.08);
      --navy:        #0B1F3A;
      --navy-mid:    #0f2747;
      --navy-card:   #112240;
      --navy-inner:  #0d1e38;
      --text-muted:  rgba(255,255,255,0.42);
      --text-dim:    rgba(255,255,255,0.28);
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,0.15);
      --amber:       #f59e0b;
      --amber-dim:   rgba(245,158,11,0.15);
      --red:         #ef4444;
      --red-dim:     rgba(239,68,68,0.15);
      --radius:      20px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; }
    body {
      background:var(--navy); min-height:100vh;
      font-family:'Lato',sans-serif;
      display:flex; flex-direction:column; align-items:center;
      padding:0 16px 80px; overflow-x:hidden;
    }

    /* ── Background atmosphere ── */
    .bg-atmosphere { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
    .bg-glow { position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.05) 0%,transparent 65%);width:800px;height:800px;top:5%;left:50%;transform:translateX(-50%); }
    .star-p { position:absolute;border-radius:50%;background:var(--gold);opacity:.07;animation:twinkle var(--d,3.8s) ease-in-out infinite alternate;animation-delay:var(--del,0s); }
    @keyframes twinkle { from{opacity:.03;} to{opacity:.16;} }

    /* ── Nav ── */
    .top-nav {
      position:relative;z-index:10;
      width:100%;max-width:960px;
      display:flex;align-items:center;justify-content:space-between;
      padding:22px 0 18px;
    }
    .nav-logo { display:flex;align-items:center;gap:9px;text-decoration:none; }
    .nav-logo-wordmark { display:flex;flex-direction:column;line-height:1;gap:2px; }
    .nav-logo-name { font-family:Georgia,'Times New Roman',serif;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.06em; }
    .nav-logo-sub  { font-size:.52rem;font-weight:700;color:rgba(201,168,76,.65);letter-spacing:.2em;text-transform:uppercase; }
    .nav-right { display:flex;align-items:center;gap:16px; }
    .nav-sign-out {
      font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
      color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;
      transition:color .18s; font-family:'Lato',sans-serif;
    }
    .nav-sign-out:hover { color:rgba(255,255,255,.65); }

    /* ── Page header ── */
    .page-header {
      position:relative;z-index:10;
      width:100%;max-width:960px;
      display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;
      padding:32px 0 28px;
      animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .header-text {}
    .ph-eyebrow { font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:8px; }
    .ph-title { font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#fff;line-height:1.2; }
    .ph-title span { color:var(--gold); }
    .ph-sub { font-size:.88rem;color:var(--text-muted);margin-top:6px;line-height:1.5; }
    .btn-add-child {
      display:inline-flex;align-items:center;gap:8px;
      padding:12px 24px;border-radius:12px;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--navy);font-family:'Lato',sans-serif;
      font-size:.82rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
      text-decoration:none;border:none;cursor:pointer;
      box-shadow:0 6px 20px rgba(201,168,76,.3);
      transition:transform .18s,box-shadow .18s;
      flex-shrink:0;
    }
    .btn-add-child:hover { transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,168,76,.45); }

    /* ── Loading / error ── */
    .status-msg {
      position:relative;z-index:10;
      color:var(--text-muted);font-size:.9rem;
      padding:60px 0;text-align:center;width:100%;
    }

    /* ── Children grid ── */
    .children-grid {
      position:relative;z-index:10;
      width:100%;max-width:960px;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
      gap:20px;
      animation:fadeUp .55s .08s cubic-bezier(.22,1,.36,1) both;
    }
    @media (max-width:500px) { .children-grid { grid-template-columns:1fr; } }

    /* ── Child card ── */
    .child-card {
      background:var(--navy-card);
      border:1px solid rgba(201,168,76,.18);
      border-radius:24px;
      overflow:hidden;
      transition:box-shadow .2s, border-color .2s;
      position:relative;
    }
    .child-card::before {
      content:'';position:absolute;inset:0;border-radius:24px;
      background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.05) 0%,transparent 55%);
      pointer-events:none;
    }
    .child-card:hover { box-shadow:0 16px 48px rgba(0,0,0,.35), 0 0 0 1px rgba(201,168,76,.32); border-color:rgba(201,168,76,.38); }

    /* Card top strip */
    .card-top {
      display:flex;align-items:center;gap:16px;
      padding:24px 24px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .child-avatar {
      width:56px;height:56px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      display:flex;align-items:center;justify-content:center;
      font-size:1.5rem;
      box-shadow:0 6px 18px rgba(201,168,76,.25);
    }
    .card-top-meta { flex:1;min-width:0; }
    .child-name {
      font-family:'Playfair Display',serif;
      font-size:1.15rem;font-weight:900;color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .child-meta-row { display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap; }
    .year-badge {
      display:inline-flex;align-items:center;
      padding:3px 11px;border-radius:99px;
      font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
      background:var(--gold-dim);color:var(--gold);
      border:1px solid rgba(201,168,76,.3);
    }
    .last-active {
      font-size:.72rem;color:var(--text-dim);font-weight:700;
    }

    /* Stats row */
    .card-stats {
      display:grid;grid-template-columns:1fr 1fr;
      padding:16px 24px;gap:0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .stat-item { display:flex;flex-direction:column;gap:3px; }
    .stat-item + .stat-item { border-left:1px solid rgba(255,255,255,.07);padding-left:20px; }
    .stat-label { font-size:.65rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim); }
    .stat-value { font-size:1.4rem;font-weight:900;color:#fff;line-height:1; }
    .stat-value.good   { color:var(--green); }
    .stat-value.ok     { color:var(--gold); }
    .stat-value.needs  { color:var(--red); }
    .stat-sub { font-size:.7rem;color:var(--text-muted);font-weight:700; }

    /* Topics section */
    .card-topics {
      padding:16px 24px;
      border-bottom:1px solid rgba(255,255,255,.06);
      min-height:70px;
    }
    .topics-label { font-size:.65rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px; }
    .topics-tags { display:flex;flex-wrap:wrap;gap:7px; }
    .topic-tag {
      display:inline-flex;align-items:center;gap:5px;
      padding:4px 11px;border-radius:99px;
      font-size:.72rem;font-weight:700;
    }
    .topic-tag.weak {
      background:var(--amber-dim);color:var(--amber);
      border:1px solid rgba(245,158,11,.25);
    }
    .topic-tag.none {
      background:var(--green-dim);color:var(--green);
      border:1px solid rgba(34,197,94,.25);
    }
    .topic-tag.no-data {
      background:rgba(255,255,255,.05);color:var(--text-dim);
      border:1px solid rgba(255,255,255,.1);
    }

    /* Action buttons */
    .card-actions {
      display:grid;grid-template-columns:1fr 1fr;
      gap:10px;padding:16px 24px 20px;
    }
    .btn-card {
      padding:11px 16px;border-radius:12px;
      font-family:'Lato',sans-serif;font-size:.78rem;font-weight:900;
      letter-spacing:.05em;text-transform:uppercase;
      border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;
      text-align:center;
    }
    .btn-card-primary {
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--navy);
      box-shadow:0 4px 14px rgba(201,168,76,.25);
    }
    .btn-card-primary:hover { transform:translateY(-1px);box-shadow:0 7px 20px rgba(201,168,76,.4); }
    .btn-card-secondary {
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.12);
    }
    .btn-card-secondary:hover { background:rgba(255,255,255,.1);color:#fff; }

    /* ── Empty state ── */
    .empty-state {
      position:relative;z-index:10;
      width:100%;max-width:500px;
      text-align:center;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:56px 40px;
      animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .empty-icon { font-size:3rem;margin-bottom:16px; }
    .empty-title { font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:900;color:#fff;margin-bottom:8px; }
    .empty-sub { font-size:.88rem;color:var(--text-muted);line-height:1.6;margin-bottom:28px; }
  </style>
</head>
<body>

<div class="bg-atmosphere">
  <div class="bg-glow"></div>
  <div class="star-p" style="width:6px;height:6px;top:8%; left:7%;  --d:4.1s;--del:.3s"></div>
  <div class="star-p" style="width:4px;height:4px;top:32%;left:94%; --d:3.5s;--del:1.1s"></div>
  <div class="star-p" style="width:5px;height:5px;top:60%;left:4%;  --d:5.2s;--del:.7s"></div>
  <div class="star-p" style="width:3px;height:3px;top:78%;left:89%; --d:3.9s;--del:2s"></div>
  <div class="star-p" style="width:4px;height:4px;top:18%;left:52%; --d:4.7s;--del:1.5s"></div>
</div>

<nav class="top-nav">
  <a class="nav-logo" href="index.html">
    <svg width="36" height="36" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="#0B1F3A" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.45"/>
      <polygon points="20,12 22.06,17.17 27.61,17.53 23.33,21.08 24.70,26.47 20,23.5 15.30,26.47 16.67,21.08 12.39,17.53 17.94,17.17" fill="#C9A84C"/>
    </svg>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;TUTOR</span>
    </div>
  </a>
  <div class="nav-right">
    <button class="nav-sign-out" onclick="signOut()">Sign out</button>
  </div>
</nav>

<div class="page-header">
  <div class="header-text">
    <div class="ph-eyebrow">Parent Portal</div>
    <div class="ph-title">Children's <span>Progress</span></div>
    <div class="ph-sub" id="ph-sub">Loading…</div>
  </div>
  <a class="btn-add-child" href="onboarding.html">+ Add Child</a>
</div>

<div id="content" class="status-msg">Loading children…</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iutcgogmxhaqgaxkznxu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
);

const AVATARS   = ['👦','👧','🧒','🌟','⭐','📚'];
const TOPIC_MAP = {
  punctuation:           'Punctuation',
  grammar:               'Grammar',
  spelling:              'Spelling',
  vocabulary:            'Vocabulary',
  comprehension_mc:      'Comprehension',
  comprehension_written: 'Comprehension (written)',
  arithmetic:            'Arithmetic',
  geometry:              'Geometry',
  fractions_decimals:    'Fractions',
  measurement:           'Measurement',
  statistics:            'Statistics',
  algebra_sequences:     'Algebra',
};

/* ── Helpers ── */
function esc(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}

function timeAgo(iso) {
  if (!iso) return null;
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'Active today';
  if (days === 1) return 'Active yesterday';
  if (days < 7)  return `Active ${days} days ago`;
  const weeks = Math.floor(days / 7);
  if (weeks === 1) return 'Active 1 week ago';
  if (weeks < 8)  return `Active ${weeks} weeks ago`;
  return 'Active ' + new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function scoreClass(pct) {
  if (pct >= 75) return 'good';
  if (pct >= 50) return 'ok';
  return 'needs';
}

/* ── Navigate to child-specific page ── */
function goToPage(childId, page) {
  localStorage.setItem('selectedChildId', childId);
  window.location.href = page;
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

/* ── Build a single child card ── */
function buildCard(child, idx, sessions, progress) {
  const avatar    = AVATARS[idx % AVATARS.length];
  const yearLabel = child.year_group === 'P7' ? 'P7' : 'P6';
  const lastActive = timeAgo(progress?.last_session_at) || (sessions.length ? timeAgo(sessions[0]?.completed_at) : null);

  /* Stats */
  const totalSprints = sessions.length;
  let avgPct = null;
  if (totalSprints > 0) {
    const sum = sessions.reduce((acc, s) => acc + (s.total_questions > 0 ? s.score / s.total_questions * 100 : 0), 0);
    avgPct = Math.round(sum / totalSprints);
  }

  /* Topics */
  const weakTopics = (progress?.topics_to_review || [])
    .map(t => TOPIC_MAP[t.topic] || t.topic)
    .filter((v, i, a) => a.indexOf(v) === i); // dedupe (comprehension_mc + comprehension_written)

  let topicsHtml;
  if (totalSprints === 0) {
    topicsHtml = `<span class="topic-tag no-data">No sprints yet</span>`;
  } else if (weakTopics.length === 0) {
    topicsHtml = `<span class="topic-tag none">✅ All topics strong</span>`;
  } else {
    topicsHtml = weakTopics.slice(0, 6).map(t =>
      `<span class="topic-tag weak">⚠️ ${esc(t)}</span>`
    ).join('');
    if (weakTopics.length > 6) {
      topicsHtml += `<span class="topic-tag no-data">+${weakTopics.length - 6} more</span>`;
    }
  }

  /* Avg score display */
  const avgDisplay = avgPct !== null
    ? `<span class="stat-value ${scoreClass(avgPct)}">${avgPct}%</span><div class="stat-sub">${avgPct >= 75 ? 'Great work' : avgPct >= 50 ? 'Building up' : 'Needs practice'}</div>`
    : `<span class="stat-value" style="font-size:1rem;color:var(--text-muted)">—</span><div class="stat-sub">No data yet</div>`;

  return `
    <div class="child-card">
      <div class="card-top">
        <div class="child-avatar">${avatar}</div>
        <div class="card-top-meta">
          <div class="child-name">${esc(child.name || 'Child')}</div>
          <div class="child-meta-row">
            <span class="year-badge">${yearLabel}</span>
            ${lastActive ? `<span class="last-active">· ${lastActive}</span>` : ''}
          </div>
        </div>
      </div>

      <div class="card-stats">
        <div class="stat-item">
          <div class="stat-label">Sprints completed</div>
          <span class="stat-value">${totalSprints}</span>
          <div class="stat-sub">${totalSprints === 1 ? '1 session' : `${totalSprints} sessions`}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Average score</div>
          ${avgDisplay}
        </div>
      </div>

      <div class="card-topics">
        <div class="topics-label">Topics to review</div>
        <div class="topics-tags">${topicsHtml}</div>
      </div>

      <div class="card-actions">
        <button class="btn-card btn-card-primary" onclick="goToPage('${child.id}', 'study.html')">
          ▶ Start Sprint
        </button>
        <button class="btn-card btn-card-secondary" onclick="goToPage('${child.id}', 'dashboard.html')">
          View Progress
        </button>
      </div>
    </div>`;
}

/* ── Main ── */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData?.session?.user) {
    window.location.href = 'login.html';
    return;
  }
  const parentId = sessionData.session.user.id;

  /* 1. Fetch children */
  const { data: children, error: childErr } = await sb
    .from('profiles')
    .select('id, name, year_group')
    .eq('parent_id', parentId)
    .order('name', { ascending: true });

  if (childErr) {
    document.getElementById('content').textContent = 'Error loading children. Please refresh.';
    console.error('[parent-dashboard] child load error:', childErr.message);
    return;
  }

  const kids = children || [];
  document.getElementById('ph-sub').textContent =
    kids.length === 0 ? 'No children linked yet.' :
    kids.length === 1 ? '1 child linked to your account.' :
    `${kids.length} children linked to your account.`;

  if (kids.length === 0) {
    document.getElementById('content').className = '';
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👨‍👩‍👧</div>
        <div class="empty-title">No children linked yet</div>
        <div class="empty-sub">Add your child's account to start tracking their SEAG transfer test progress.</div>
        <a class="btn-add-child" href="onboarding.html">+ Add a Child</a>
      </div>`;
    return;
  }

  /* 2. Batch-fetch sessions + progress_summary for all children */
  const childIds = kids.map(c => c.id);

  const [{ data: allSessions }, { data: allProgress }] = await Promise.all([
    sb.from('sessions')
      .select('user_id, score, total_questions, completed_at')
      .in('user_id', childIds)
      .order('completed_at', { ascending: false }),
    sb.from('progress_summary')
      .select('user_id, topics_to_review, last_session_at')
      .in('user_id', childIds),
  ]);

  /* 3. Group by child id */
  const sessionsByChild  = {};
  const progressByChild  = {};
  childIds.forEach(id => { sessionsByChild[id] = []; });
  (allSessions || []).forEach(s => { if (sessionsByChild[s.user_id]) sessionsByChild[s.user_id].push(s); });
  (allProgress || []).forEach(p => { progressByChild[p.user_id] = p; });

  /* 4. Render */
  const grid = document.createElement('div');
  grid.className = 'children-grid';
  grid.innerHTML = kids.map((child, i) =>
    buildCard(child, i, sessionsByChild[child.id] || [], progressByChild[child.id] || null)
  ).join('');

  const content = document.getElementById('content');
  content.replaceWith(grid);
});
</script>
</body>
</html>
