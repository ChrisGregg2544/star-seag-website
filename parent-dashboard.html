<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR — Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cookie-consent.js"></script>
  <style>
    :root {
      --orange:       #F97316;
      --orange-dark:  #EA6C0A;
      --orange-light: #FB923C;
      --yellow:       #F59E0B;
      --yellow-dark:  #D97706;
      --cream:        #FEF3E2;
      --cream-border: #F0E0C0;
      --text-dark:    #333333;
      --text-mid:     #666666;
      --text-light:   #999999;
      --card-border:  #E8D8B8;
      --green:        #58CC02;
      --green-dark:   #46A302;
      --red:          #EF4444;
      --amber:        #F59E0B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      background: var(--cream);
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--text-dark);
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* ── Nav ── */
    .top-nav {
      background: var(--orange);
      box-shadow: 0 4px 0 var(--orange-dark);
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-star {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .nav-logo-wordmark { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
    .nav-logo-name { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: .04em; }
    .nav-logo-sub  { font-size: .48rem; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .18em; text-transform: uppercase; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; border: none;
      font-family: 'Nunito', sans-serif; transition: all .15s; text-decoration: none; display: inline-block;
    }
    .nav-btn-ghost   { background: rgba(255,255,255,.2); color: #fff; border: 2px solid rgba(255,255,255,.4); }
    .nav-btn-ghost:hover { background: rgba(255,255,255,.32); }
    .nav-btn-danger  { background: rgba(239,68,68,.2); color: #fff; border: 2px solid rgba(239,68,68,.4); }
    .nav-btn-danger:hover { background: rgba(239,68,68,.35); }

    /* ── Wrapper ── */
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
    }
    .ph-eyebrow {
      font-size: .68rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
      color: var(--orange); margin-bottom: 6px;
    }
    .ph-title { font-size: 1.75rem; font-weight: 900; color: var(--text-dark); line-height: 1.2; }
    .ph-sub   { font-size: .88rem; color: var(--text-mid); margin-top: 5px; }
    .btn-add-child {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 12px;
      background: var(--orange); color: #fff;
      font-family: 'Nunito', sans-serif; font-size: .82rem; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 4px 0 var(--orange-dark);
      transition: transform .15s, box-shadow .15s; flex-shrink: 0;
    }
    .btn-add-child:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--orange-dark); }
    .btn-add-child:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-dark); }

    /* ── Status ── */
    .status-msg { text-align: center; color: var(--text-mid); padding: 60px 0; font-size: .95rem; }

    /* ── Children grid ── */
    .children-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }
    @media (max-width: 520px) { .children-grid { grid-template-columns: 1fr; } }

    /* ── Child card ── */
    .child-card {
      background: #fff;
      border: 2px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .child-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.11); transform: translateY(-2px); }

    /* Card header */
    .card-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 22px 16px;
      border-bottom: 2px solid var(--cream-border);
    }
    .child-avatar {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--orange), var(--orange-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 12px rgba(255,109,0,.25);
    }
    .card-header-meta { flex: 1; min-width: 0; }
    .child-name {
      font-size: 1.1rem; font-weight: 900; color: var(--text-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .year-badge {
      display: inline-flex; align-items: center;
      padding: 3px 11px; border-radius: 99px;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
      background: #FFF3E0; color: var(--orange);
      border: 1px solid rgba(255,109,0,.25);
    }
    .last-active { font-size: .72rem; color: var(--text-light); font-weight: 700; }

    /* Stats strip */
    .card-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 14px 22px; gap: 0;
      border-bottom: 2px solid var(--cream-border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-item + .stat-item { border-left: 2px solid var(--cream-border); padding-left: 20px; }
    .stat-label { font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--text-light); }
    .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--text-dark); line-height: 1.1; }
    .stat-value.good  { color: var(--green); }
    .stat-value.ok    { color: var(--orange); }
    .stat-value.needs { color: var(--red); }
    .stat-sub { font-size: .7rem; color: var(--text-light); font-weight: 700; }

    /* Topics */
    .card-topics {
      padding: 14px 22px;
      border-bottom: 2px solid var(--cream-border);
      min-height: 66px;
    }
    .topics-label { font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }
    .topics-tags  { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 99px;
      font-size: .72rem; font-weight: 700;
    }
    .topic-tag.weak    { background: rgba(245,158,11,.1); color: #B45309; border: 1px solid rgba(245,158,11,.3); }
    .topic-tag.strong  { background: rgba(88,204,2,.1);   color: #2D7D00; border: 1px solid rgba(88,204,2,.3); }
    .topic-tag.no-data { background: #F5F5F5; color: var(--text-light); border: 1px solid #E0E0E0; }

    /* Action buttons */
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 22px 18px; }
    .btn-action {
      padding: 11px 14px; border-radius: 10px;
      font-family: 'Nunito', sans-serif; font-size: .78rem; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      border: none; cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .btn-action-primary {
      background: var(--orange); color: #fff;
      box-shadow: 0 3px 0 var(--orange-dark);
    }
    .btn-action-primary:hover  { transform: translateY(-1px); box-shadow: 0 4px 0 var(--orange-dark); }
    .btn-action-primary:active { transform: translateY(1px);  box-shadow: 0 1px 0 var(--orange-dark); }
    .btn-action-secondary {
      background: #fff; color: var(--text-mid);
      border: 2px solid var(--card-border);
    }
    .btn-action-secondary:hover { background: var(--cream); color: var(--text-dark); border-color: var(--cream-border); }

    /* AI Insights */
    .insights-toggle {
      width: 100%; padding: 11px 22px;
      background: #FFF9F0; border: none; border-top: 2px solid var(--cream-border);
      font-family: 'Nunito', sans-serif; font-size: .75rem; font-weight: 800;
      color: var(--orange); letter-spacing: .05em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: background .15s;
    }
    .insights-toggle:hover { background: var(--cream); }
    .insights-panel {
      padding: 16px 22px; background: #FAFAF8;
      border-top: 1px solid var(--cream-border);
    }
    .insight-group { margin-bottom: 14px; }
    .insight-group:last-child { margin-bottom: 0; }
    .insight-group-title {
      font-size: .6rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-light); margin-bottom: 7px;
    }
    .insight-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #F0ECE4;
    }
    .insight-row:last-child { border-bottom: none; }
    .insight-name { font-size: .81rem; font-weight: 700; color: var(--text-dark); }
    .insight-badge {
      flex-shrink: 0; font-size: .7rem; font-weight: 800;
      padding: 3px 10px; border-radius: 99px;
    }
    .badge-weak      { background: #FEE2E2; color: #B91C1C; }
    .badge-improving { background: #D1FAE5; color: #065F46; }
    .badge-strong    { background: #DCFCE7; color: #166534; }

    /* ── Exam badge ── */
    .exam-badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 99px;
      font-size: .63rem; font-weight: 900; letter-spacing: .06em;
      background: #FFF3E0; color: var(--orange);
      border: 1px solid rgba(249,115,22,.25);
    }

    /* ── Last session line ── */
    .card-last-session {
      padding: 8px 22px;
      border-bottom: 1px solid var(--cream-border);
      font-size: .76rem; color: var(--text-mid); font-weight: 700;
    }

    /* ── Weekly progress ── */
    .card-weekly { padding: 10px 22px 12px; border-bottom: 2px solid var(--cream-border); }
    .weekly-row  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .weekly-text { font-size: .72rem; font-weight: 800; color: var(--text-dark); }
    .weekly-bar-wrap { background: #EDE5D5; border-radius: 99px; height: 7px; overflow: hidden; }
    .weekly-bar-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }

    /* ── Score chart ── */
    .card-chart  { padding: 12px 22px 14px; border-bottom: 2px solid var(--cream-border); }
    .chart-title {
      font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-light); margin-bottom: 8px;
    }

    /* ── Chart placeholder ── */
    .card-chart-placeholder {
      padding: 16px 22px;
      border-bottom: 2px solid var(--cream-border);
      font-size: .76rem; color: var(--text-light);
      font-style: italic; text-align: center; line-height: 1.5;
    }

    /* ── Topics two-column ── */
    .topics-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* ── Parent tip ── */
    .card-tip {
      margin: 0 22px 14px;
      background: #FFFBEB;
      border: 1.5px solid rgba(245,158,11,.22);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: .78rem; color: #78350F;
      line-height: 1.55; font-weight: 700;
    }

    /* Empty state */
    .empty-state {
      max-width: 480px; margin: 60px auto; text-align: center;
      background: #fff; border: 2px solid var(--card-border);
      border-radius: 20px; padding: 48px 36px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
    }
    .empty-icon  { font-size: 3rem; margin-bottom: 14px; }
    .empty-title { font-size: 1.2rem; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; }
    .empty-sub   { font-size: .88rem; color: var(--text-mid); line-height: 1.6; margin-bottom: 24px; }

    /* ── Edit pencil button ── */
    .edit-pencil-btn {
      flex-shrink: 0; background: none;
      border: 1.5px solid var(--cream-border); border-radius: 8px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-light);
      transition: all .15s;
    }
    .edit-pencil-btn:hover { background: var(--cream); color: var(--orange); border-color: var(--orange-light); }

    /* ── Edit modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-box {
      background: #fff; border-radius: 20px;
      padding: 32px 28px 28px;
      width: 100%; max-width: 420px;
      box-shadow: 0 16px 48px rgba(0,0,0,.22);
      transform: translateY(14px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal-box { transform: translateY(0); }
    .modal-title {
      font-size: 1.2rem; font-weight: 900; color: var(--text-dark);
      margin-bottom: 22px;
    }
    .modal-label {
      font-size: .68rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-light);
      margin-bottom: 8px; display: block;
    }
    .modal-input {
      width: 100%; background: #fff;
      border: 2px solid var(--card-border); border-radius: 12px;
      padding: 13px 16px; margin-bottom: 20px;
      font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700;
      color: var(--text-dark); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .modal-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .modal-yr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .modal-yr-btn {
      background: var(--cream); border: 2px solid var(--cream-border);
      border-radius: 12px; padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-family: 'Nunito', sans-serif; cursor: pointer;
      transition: all .2s; position: relative; overflow: hidden;
    }
    .modal-yr-btn:hover { border-color: var(--orange-light); background: #FFF3E8; }
    .modal-yr-btn.sel {
      border-color: var(--orange); background: #FFF3E8;
      box-shadow: 0 3px 0 var(--orange-light);
    }
    .modal-yr-btn.sel::after {
      content: ''; position: absolute; top: 7px; right: 8px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--orange);
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E") center/10px no-repeat;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E") center/10px no-repeat;
    }
    .modal-yr-lbl { font-size: 1.1rem; font-weight: 900; color: var(--text-dark); }
    .modal-yr-sub { font-size: .65rem; font-weight: 700; color: var(--text-light); }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .modal-error {
      display: none; background: rgba(239,68,68,.08);
      border: 1.5px solid rgba(239,68,68,.3); border-radius: 10px;
      padding: 10px 14px; font-size: .8rem; color: var(--red);
      font-weight: 700; margin-bottom: 14px; text-align: center;
    }
    .modal-error.show { display: block; }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-star">⭐</div>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;TUTOR</span>
    </div>
  </a>
  <div class="nav-right">
    <button class="nav-btn nav-btn-danger" onclick="signOut()">Sign Out</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-header">
    <div>
      <div class="ph-eyebrow">Parent Portal</div>
      <div class="ph-title">Children's Progress</div>
      <div class="ph-sub" id="ph-sub">Loading…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a class="btn-add-child" href="real-life-test.html" style="background:#7C3AED;box-shadow:0 4px 0 #5B21B6;">📄 Print Full Mock Test</a>
      <a class="btn-add-child" href="add-child.html">+ Add Child</a>
    </div>
  </div>

  <div id="content" class="status-msg">Loading children…</div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iutcgogmxhaqgaxkznxu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
);

// Module-level state — needed by edit modal and card refresh
let _kidsData        = [];   // [{id, name, year_group, exam_year}]
let _kidsIdx         = {};   // childId → array index
let _sessionsByChild = {};
let _progressByChild = {};
let _qrByChild       = {};
let _subscribed      = false;
let _accessToken     = null;
let _editingChildId  = null;
let _editSelYear     = null;

const AVATARS   = ['👦','👧','🧒','🌟','⭐','📚'];
const TOPIC_MAP = {
  punctuation:           'Punctuation',
  grammar:               'Grammar',
  spelling:              'Spelling',
  vocabulary:            'Vocabulary',
  comprehension_mc:      'Comprehension',
  comprehension_written: 'Comprehension (written)',
  arithmetic:            'Arithmetic',
  geometry:              'Geometry',
  fractions_decimals:    'Fractions',
  measurement:           'Measurement',
  statistics:            'Statistics',
  algebra_sequences:     'Algebra',
};

const ENGLISH_TOPICS = new Set(['punctuation','grammar','spelling','vocabulary','comprehension_mc','comprehension_written']);
const MATHS_TOPICS   = new Set(['arithmetic','geometry','fractions_decimals','measurement','statistics','algebra_sequences']);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}

function timeAgo(iso) {
  if (!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (d === 0) return 'Active today';
  if (d === 1) return 'Active yesterday';
  if (d < 7)  return `Active ${d} days ago`;
  const w = Math.floor(d / 7);
  if (w < 8)  return `Active ${w} week${w > 1 ? 's' : ''} ago`;
  return 'Active ' + new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function scoreClass(pct) {
  return pct >= 75 ? 'good' : pct >= 50 ? 'ok' : 'needs';
}

function goToPage(childId, page) {
  localStorage.setItem('selectedChildId', childId);
  window.location.href = page;
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

function topicLabel(raw) {
  return TOPIC_MAP[raw] || raw.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function relativeTime(iso) {
  if (!iso) return null;
  const ms   = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(ms / 60000);
  if (mins < 2)   return 'just now';
  if (mins < 60)  return `${mins} minutes ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)   return `${hrs} hour${hrs > 1 ? 's' : ''} ago`;
  const days = Math.floor(hrs / 24);
  if (days === 1) return 'yesterday';
  if (days < 7)   return `${days} days ago`;
  const wks = Math.floor(days / 7);
  if (wks < 8)    return `${wks} week${wks > 1 ? 's' : ''} ago`;
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function getMondayOfWeek(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
  return date;
}

function weekKey(date) {
  return getMondayOfWeek(date).toISOString().slice(0, 10);
}

function titleCase(s) {
  if (!s) return '';
  return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatSessionType(session) {
  if (!session) return null;
  const { session_type, track, score, total_questions, completed_at } = session;
  let label;
  if      (session_type === 'full_mock')     label = 'Full Mock';
  else if (session_type === 'topic_sprint')  label = track ? `${titleCase(track)} Sprint` : 'Topic Sprint';
  else if (session_type === 'guardian_test') label = 'Supervised Test';
  else if (total_questions >= 50)            label = 'Full Mock';
  else                                       label = 'Session';
  const scoreStr = (score != null && total_questions > 0) ? `${score}/${total_questions}` : '';
  const when     = relativeTime(completed_at);
  const detail   = [scoreStr, when].filter(Boolean).join(' · ');
  return detail ? `${label} — ${detail}` : label;
}

function computeWeeklyCount(sessions) {
  const mon = getMondayOfWeek(new Date());
  const sun = new Date(mon); sun.setDate(sun.getDate() + 7);
  return sessions.filter(s => { const d = new Date(s.completed_at); return d >= mon && d < sun; }).length;
}

function computeExamWeeks(examYear) {
  if (!examYear) return null;
  const nov1     = new Date(examYear, 10, 1);
  const firstThu = 1 + ((4 - nov1.getDay() + 7) % 7);
  const examDate = new Date(examYear, 10, firstThu + 14);
  const msLeft   = examDate - Date.now();
  if (msLeft < 0) return null;
  return Math.ceil(msLeft / (7 * 24 * 3600 * 1000));
}

function computeChartData(sessions, qr) {
  const sidToWeek = {};
  sessions.forEach(s => { if (s.completed_at) sidToWeek[s.id] = weekKey(s.completed_at); });

  const buckets = {};
  qr.forEach(r => {
    const wk = sidToWeek[r.session_id];
    if (!wk) return;
    if (!buckets[wk]) buckets[wk] = { eng: { c:0,t:0 }, mat: { c:0,t:0 } };
    const subj = ENGLISH_TOPICS.has(r.topic) ? 'eng' : MATHS_TOPICS.has(r.topic) ? 'mat' : null;
    if (!subj) return;
    buckets[wk][subj].t++;
    if (r.correct) buckets[wk][subj].c++;
  });

  const weeks = [];
  const now   = getMondayOfWeek(new Date());
  for (let i = 5; i >= 0; i--) {
    const mon = new Date(now); mon.setDate(mon.getDate() - i * 7);
    const wk  = mon.toISOString().slice(0, 10);
    const lbl = mon.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const b   = buckets[wk];
    weeks.push({
      wk, label: lbl,
      engPct: (b && b.eng.t >= 2) ? Math.round(b.eng.c / b.eng.t * 100) : null,
      matPct: (b && b.mat.t >= 2) ? Math.round(b.mat.c / b.mat.t * 100) : null,
    });
  }

  const weeksWithData = weeks.filter(w => w.engPct !== null || w.matPct !== null).length;
  return { weeks, hasData: weeksWithData >= 2 };
}

function buildChartSvg({ hasData, weeks }) {
  if (!hasData) return '';

  const VW = 280, VH = 128;
  const pL = 26, pR = 6, pT = 8, pB = 22;
  const plotW = VW - pL - pR;
  const plotH = VH - pT - pB;
  const n     = weeks.length;
  const xOf   = i   => pL + (i / (n - 1)) * plotW;
  const yOf   = pct => pT + plotH - (pct / 100) * plotH;
  const r1    = v   => Math.round(v * 10) / 10;

  let s = `<svg viewBox="0 0 ${VW} ${VH}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">`;

  [25, 50, 75].forEach(y => {
    s += `<line x1="${pL}" y1="${r1(yOf(y))}" x2="${pL + plotW}" y2="${r1(yOf(y))}" stroke="#EDE5D5" stroke-width="1"/>`;
  });
  s += `<line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT + plotH}" stroke="#D0C0A0" stroke-width="1"/>`;
  s += `<line x1="${pL}" y1="${pT + plotH}" x2="${pL + plotW}" y2="${pT + plotH}" stroke="#D0C0A0" stroke-width="1"/>`;

  [0, 50, 100].forEach(y => {
    s += `<text x="${pL - 3}" y="${r1(yOf(y) + 3.5)}" text-anchor="end" font-size="7" fill="#AAA" font-family="Nunito,sans-serif">${y}</text>`;
  });
  weeks.forEach((w, i) => {
    s += `<text x="${r1(xOf(i))}" y="${VH - 1}" text-anchor="middle" font-size="7" fill="#AAA" font-family="Nunito,sans-serif">${w.label}</text>`;
  });

  [['eng', '#3B82F6', 'engPct'], ['mat', '#F97316', 'matPct']].forEach(([, color, key]) => {
    let pts = [];
    const flush = () => {
      if (pts.length >= 2) {
        s += `<polyline points="${pts.map(p => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      pts = [];
    };
    weeks.forEach((w, i) => { if (w[key] !== null) pts.push([r1(xOf(i)), r1(yOf(w[key]))]); else flush(); });
    flush();
    weeks.forEach((w, i) => {
      if (w[key] !== null) s += `<circle cx="${r1(xOf(i))}" cy="${r1(yOf(w[key]))}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
    });
  });

  const lx = pL + plotW - 60, ly = pT + 2;
  s += `<rect x="${lx}" y="${ly}" width="8" height="8" rx="2" fill="#3B82F6"/>`;
  s += `<text x="${lx + 11}" y="${ly + 7}" font-size="7.5" fill="#666" font-family="Nunito,sans-serif" font-weight="700">English</text>`;
  s += `<rect x="${lx}" y="${ly + 13}" width="8" height="8" rx="2" fill="#F97316"/>`;
  s += `<text x="${lx + 11}" y="${ly + 20}" font-size="7.5" fill="#666" font-family="Nunito,sans-serif" font-weight="700">Maths</text>`;

  s += '</svg>';
  return s;
}

function buildTip(sessions, qr, avgPct, chartData) {
  if (!sessions.length) return null;

  const compQr = qr.filter(r => r.topic === 'comprehension_mc' || r.topic === 'comprehension_written');
  if (compQr.length >= 3) {
    const compPct = Math.round(compQr.filter(r => r.correct).length / compQr.length * 100);
    if (compPct < 50) return '📚 Try reading together for 10 minutes before bed — it makes a big difference for comprehension.';
  }

  if (avgPct !== null && avgPct < 50) return '⏱️ Short daily sessions work better than long weekly ones — even 15 minutes a day adds up.';

  if (chartData?.hasData) {
    const { weeks } = chartData;
    const avgOf = ws => {
      const pts = ws.flatMap(w => [w.engPct, w.matPct]).filter(v => v !== null);
      return pts.length ? pts.reduce((a, b) => a + b, 0) / pts.length : null;
    };
    const rAvg = avgOf(weeks.slice(-2));
    const pAvg = avgOf(weeks.slice(-4, -2));
    if (rAvg !== null && pAvg !== null && rAvg - pAvg >= 10) return '🚀 Great progress recently! Keep the momentum going.';
  }

  if (avgPct !== null && avgPct >= 80) return '🎓 Excellent work! Consider trying a Full Mock to simulate real exam conditions.';

  return null;
}

function toggleInsights(childId) {
  const panel   = document.getElementById('insights-' + childId);
  const chevron = document.getElementById('chevron-' + childId);
  if (!panel) return;
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  if (chevron) chevron.textContent = open ? '▼' : '▲';
}

function computeInsights(sessions, qr) {
  if (sessions.length < 3 || qr.length === 0) return null;

  // Overall per-topic accuracy
  const topicMap = {};
  qr.forEach(r => {
    if (!r.topic) return;
    if (!topicMap[r.topic]) topicMap[r.topic] = { c: 0, t: 0 };
    topicMap[r.topic].t++;
    if (r.correct) topicMap[r.topic].c++;
  });

  const allTopics = Object.entries(topicMap)
    .filter(([, v]) => v.t >= 3)
    .map(([name, v]) => ({ name, pct: Math.round(v.c / v.t * 100) }));

  const needsPractice = allTopics.filter(t => t.pct < 70).sort((a, b) => a.pct - b.pct).slice(0, 3);
  const strongAreas   = allTopics.filter(t => t.pct >= 85).sort((a, b) => b.pct - a.pct).slice(0, 3);

  // Improving: compare last 2 sessions vs all previous
  const sorted    = [...sessions].sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
  const recentIds = new Set(sorted.slice(0, 2).map(s => s.id));
  const prevIds   = new Set(sorted.slice(2).map(s => s.id));

  const improving = [];
  if (prevIds.size >= 1) {
    const rec = {}, prev = {};
    qr.forEach(r => {
      if (!r.topic || !r.session_id) return;
      const bucket = recentIds.has(r.session_id) ? rec : prevIds.has(r.session_id) ? prev : null;
      if (!bucket) return;
      if (!bucket[r.topic]) bucket[r.topic] = { c: 0, t: 0 };
      bucket[r.topic].t++;
      if (r.correct) bucket[r.topic].c++;
    });
    Object.entries(rec).forEach(([topic, rv]) => {
      if (rv.t < 2) return;
      const pv = prev[topic];
      if (!pv || pv.t < 2) return;
      const rPct = Math.round(rv.c / rv.t * 100);
      const pPct = Math.round(pv.c / pv.t * 100);
      if (rPct - pPct >= 10) improving.push({ name: topic, prevPct: pPct, nowPct: rPct });
    });
    improving.sort((a, b) => (b.nowPct - b.prevPct) - (a.nowPct - a.prevPct));
  }

  if (!needsPractice.length && !improving.length && !strongAreas.length) return null;
  return { needsPractice, improving, strongAreas };
}

function buildInsightsHtml(insights, childId) {
  if (!insights) return '';
  const { needsPractice, improving, strongAreas } = insights;

  const rows = (items, badgeClass, fmt) =>
    items.map(t => `
      <div class="insight-row">
        <span class="insight-name">${esc(topicLabel(t.name))}</span>
        <span class="insight-badge ${badgeClass}">${fmt(t)}</span>
      </div>`).join('');

  const needsHtml = needsPractice.length ? `
    <div class="insight-group">
      <div class="insight-group-title">📉 Needs Practice</div>
      ${rows(needsPractice, 'badge-weak', t => `${t.pct}% accuracy`)}
    </div>` : '';

  const improvingHtml = improving.length ? `
    <div class="insight-group">
      <div class="insight-group-title">📈 Improving</div>
      ${rows(improving, 'badge-improving', t => `${t.prevPct}% → ${t.nowPct}% ↗`)}
    </div>` : '';

  const strongHtml = strongAreas.length ? `
    <div class="insight-group">
      <div class="insight-group-title">💪 Strong Areas</div>
      ${rows(strongAreas, 'badge-strong', t => `${t.pct}% accuracy`)}
    </div>` : '';

  return `
    <button class="insights-toggle" onclick="toggleInsights('${childId}')">
      📊 AI Insights
      <span class="insights-chevron" id="chevron-${childId}">▼</span>
    </button>
    <div class="insights-panel" id="insights-${childId}" style="display:none">
      ${needsHtml}${improvingHtml}${strongHtml}
    </div>`;
}

function buildCard(child, idx, sessions, progress, insightsHtml = '', subscribed = true, qr = []) {
  const avatar     = AVATARS[idx % AVATARS.length];
  const yearLabel  = child.year_group === 'P7' ? 'P7' : 'P6';
  const lastActive = timeAgo(progress?.last_session_at ?? sessions[0]?.completed_at);
  const total      = sessions.length;

  const avgPct = total > 0
    ? Math.round(sessions.reduce((a, s) => a + (s.total_questions > 0 ? s.score / s.total_questions * 100 : 0), 0) / total)
    : null;

  // ── Exam countdown ──
  const examWeeks = computeExamWeeks(child.exam_year);
  const examBadge = examWeeks === null ? '' :
    `<span class="exam-badge">${examWeeks <= 2 ? '🗓️ Exam very soon!' : `🗓️ ${examWeeks} weeks to exam`}</span>`;

  // ── Weak topics (from progress_summary) ──
  const weakTopicKeys = new Set((progress?.topics_to_review || []).map(t => t.topic));
  const weakTopics    = [...weakTopicKeys].map(t => TOPIC_MAP[t] || topicLabel(t));

  // ── Strengths (from question_results — ≥70% accuracy, ≥3 answered) ──
  const topicAcc = {};
  qr.forEach(r => {
    if (!r.topic) return;
    if (!topicAcc[r.topic]) topicAcc[r.topic] = { c: 0, t: 0 };
    topicAcc[r.topic].t++;
    if (r.correct) topicAcc[r.topic].c++;
  });
  const strengths = Object.entries(topicAcc)
    .filter(([, v]) => v.t >= 3 && (v.c / v.t) >= 0.70)
    .sort((a, b) => (b[1].c / b[1].t) - (a[1].c / a[1].t))
    .map(([topic]) => TOPIC_MAP[topic] || topicLabel(topic));

  // ── Topics HTML ──
  let weakTagsHtml;
  if (total === 0) {
    weakTagsHtml = `<span class="topic-tag no-data">No sprints yet</span>`;
  } else if (weakTopics.length === 0) {
    weakTagsHtml = `<span class="topic-tag strong">✅ All topics strong</span>`;
  } else {
    weakTagsHtml = weakTopics.slice(0, 4).map(t => `<span class="topic-tag weak">⚠️ ${esc(t)}</span>`).join('');
    if (weakTopics.length > 4) weakTagsHtml += `<span class="topic-tag no-data">+${weakTopics.length - 4} more</span>`;
  }

  const topicsHtml = strengths.length > 0 ? `
    <div class="topics-two-col">
      <div>
        <div class="topics-label">Topics to review</div>
        <div class="topics-tags">${weakTagsHtml}</div>
      </div>
      <div>
        <div class="topics-label">Strengths</div>
        <div class="topics-tags">${strengths.slice(0, 4).map(t => `<span class="topic-tag strong">✅ ${esc(t)}</span>`).join('')}</div>
      </div>
    </div>` : `
    <div class="topics-label">Topics to review</div>
    <div class="topics-tags">${weakTagsHtml}</div>`;

  // ── Last session ──
  // If track looks like a year group (P6/P7) rather than a topic, derive the topic
  // from the most-answered topic in question_results for that session.
  let lastSessionHtml = '';
  if (sessions.length) {
    const s = sessions[0];
    let derivedTrack = s.track;
    if (derivedTrack && /^P[67]$/i.test(derivedTrack)) {
      const topicCount = {};
      qr.filter(r => r.session_id === s.id).forEach(r => {
        if (r.topic) topicCount[r.topic] = (topicCount[r.topic] || 0) + 1;
      });
      const best = Object.entries(topicCount).sort((a, b) => b[1] - a[1])[0];
      if (best) derivedTrack = best[0];
    }
    lastSessionHtml = `<div class="card-last-session">Last session: ${esc(formatSessionType({ ...s, track: derivedTrack }))}</div>`;
  }

  // ── Weekly progress ──
  const weeklyDone     = computeWeeklyCount(sessions);
  const weeklyTarget   = child.sessions_per_week || 5;
  const weeklyExceeded = weeklyDone >= weeklyTarget;
  const weeklyPct      = Math.min(100, Math.round(weeklyDone / weeklyTarget * 100));
  const weeklyColor    = weeklyExceeded ? 'var(--green)' : weeklyDone > 0 ? 'var(--orange)' : '#C8B89A';
  const weeklyLabel    = weeklyExceeded
    ? `${weeklyDone} sessions this week — target exceeded! 🎉`
    : `${weeklyDone} of ${weeklyTarget} sessions this week`;
  const weeklyHtml     = `
    <div class="card-weekly">
      <div class="weekly-row">
        <span class="weekly-text">${weeklyLabel}</span>
      </div>
      <div class="weekly-bar-wrap">
        <div class="weekly-bar-fill" style="width:${weeklyPct}%;background:${weeklyColor}"></div>
      </div>
    </div>`;

  // ── Score trend chart ──
  const chartData = computeChartData(sessions, qr);
  const chartSvg  = buildChartSvg(chartData);
  const chartHtml = chartSvg
    ? `<div class="card-chart"><div class="chart-title">Score trend — last 6 weeks</div>${chartSvg}</div>`
    : `<div class="card-chart-placeholder">📈 Progress chart will appear here as your child completes more sessions</div>`;

  // ── Parent tip ──
  const tipText = buildTip(sessions, qr, avgPct, chartData);
  const tipHtml = tipText ? `<div class="card-tip">${tipText}</div>` : '';

  // ── Stats strip ──
  const avgHtml = avgPct !== null
    ? `<span class="stat-value ${scoreClass(avgPct)}">${avgPct}%</span><div class="stat-sub">${avgPct >= 75 ? 'Great work' : avgPct >= 50 ? 'Building up' : 'Needs practice'}</div>`
    : `<span class="stat-value" style="font-size:1.1rem;color:var(--text-light)">—</span><div class="stat-sub">No data yet</div>`;

  return `
    <div class="child-card" id="child-card-${child.id}">
      <div class="card-header">
        <div class="child-avatar">${avatar}</div>
        <div class="card-header-meta">
          <div class="child-name">${esc(child.name || 'Child')}</div>
          <div class="card-meta-row">
            <span class="year-badge">${yearLabel}</span>
            ${examBadge}
            ${lastActive ? `<span class="last-active">· ${lastActive}</span>` : ''}
          </div>
        </div>
        <button class="edit-pencil-btn" onclick="openEditModal('${child.id}')" title="Edit child details">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
      <div class="card-stats">
        <div class="stat-item">
          <div class="stat-label">Sprints completed</div>
          <span class="stat-value">${total}</span>
          <div class="stat-sub">${total === 1 ? '1 session' : `${total} sessions`}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Average score</div>
          ${avgHtml}
        </div>
      </div>
      ${lastSessionHtml}
      ${weeklyHtml}
      ${chartHtml}
      <div class="card-topics">
        ${topicsHtml}
      </div>
      ${tipHtml}
      <div class="card-actions">
        <button class="btn-action btn-action-secondary" onclick="goToPage('${child.id}','dashboard.html')">Go to Student Dashboard</button>
        <button class="btn-action btn-action-secondary"
          onclick="window.location.href='${subscribed ? `real-life-test.html?childId=${child.id}&year=${child.year_group}` : 'pricing.html'}'">
          ${subscribed ? '📄 Print Full Mock Test' : '🔒 Print Full Mock Test'}</button>
      </div>
      ${insightsHtml}
    </div>`;
}

function openEditModal(childId) {
  const child = _kidsData[_kidsIdx[childId]];
  if (!child) return;
  _editingChildId = childId;

  document.getElementById('edit-name-input').value = child.name || '';

  _editSelYear = child.year_group || 'P6';
  document.getElementById('edit-yr-p6').classList.toggle('sel', _editSelYear === 'P6');
  document.getElementById('edit-yr-p7').classList.toggle('sel', _editSelYear === 'P7');

  // Default exam_year: current year unless after Nov 22 → next year
  const _now = new Date();
  const defaultYear = _now > new Date(_now.getFullYear(), 10, 22)
    ? _now.getFullYear() + 1 : _now.getFullYear();
  document.getElementById('edit-exam-year-input').value = child.exam_year || defaultYear;

  document.getElementById('edit-modal-error').classList.remove('show');
  document.getElementById('edit-modal-error').textContent = '';
  document.getElementById('edit-save-btn').disabled  = false;
  document.getElementById('edit-save-btn').textContent = 'Save Changes';

  document.getElementById('edit-modal-overlay').classList.add('open');
  document.getElementById('edit-name-input').focus();
}

function editSelectYear(yr) {
  _editSelYear = yr;
  document.getElementById('edit-yr-p6').classList.toggle('sel', yr === 'P6');
  document.getElementById('edit-yr-p7').classList.toggle('sel', yr === 'P7');
}

function cancelEdit() {
  document.getElementById('edit-modal-overlay').classList.remove('open');
  _editingChildId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('edit-modal-overlay')) cancelEdit();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cancelEdit();
});

async function saveEdit() {
  const name     = document.getElementById('edit-name-input').value.trim();
  const examYear = parseInt(document.getElementById('edit-exam-year-input').value, 10);
  const errEl    = document.getElementById('edit-modal-error');
  const saveBtn  = document.getElementById('edit-save-btn');

  errEl.classList.remove('show');

  if (!name) {
    errEl.textContent = 'Please enter a name.';
    errEl.classList.add('show');
    return;
  }
  if (!_editSelYear) {
    errEl.textContent = 'Please select a year group.';
    errEl.classList.add('show');
    return;
  }
  if (!examYear || examYear < 2025 || examYear > 2040) {
    errEl.textContent = 'Please enter a valid exam year (2025–2040).';
    errEl.classList.add('show');
    return;
  }

  saveBtn.disabled  = true;
  saveBtn.textContent = 'Saving…';

  try {
    const { data: session } = await sb.auth.getSession();
    const token = session?.session?.access_token || _accessToken;

    const res  = await fetch('/api/child?action=edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ childId: _editingChildId, name, year_group: _editSelYear, exam_year: examYear }),
    });
    const json = await res.json();

    if (!res.ok || !json.ok) {
      errEl.textContent = json.error || 'Failed to save. Please try again.';
      errEl.classList.add('show');
      saveBtn.disabled  = false;
      saveBtn.textContent = 'Save Changes';
      return;
    }

    // Update module-level data
    const idx = _kidsIdx[_editingChildId];
    if (idx !== undefined) {
      _kidsData[idx] = { ..._kidsData[idx], name, year_group: _editSelYear, exam_year: examYear };
    }

    cancelEdit();
    refreshCardDOM(_editingChildId);

  } catch (err) {
    console.error('[edit-child]', err);
    errEl.textContent = 'Network error. Please try again.';
    errEl.classList.add('show');
    saveBtn.disabled  = false;
    saveBtn.textContent = 'Save Changes';
  }
}

function refreshCardDOM(childId) {
  const idx = _kidsIdx[childId];
  if (idx === undefined) return;
  const child        = _kidsData[idx];
  const sessions     = _sessionsByChild[childId] || [];
  const qr           = _qrByChild[childId]       || [];
  const insights     = computeInsights(sessions, qr);
  const insightsHtml = buildInsightsHtml(insights, childId);
  const cardEl       = document.getElementById('child-card-' + childId);
  if (!cardEl) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = buildCard(child, idx, sessions, _progressByChild[childId] || null, insightsHtml, _subscribed, qr);
  cardEl.replaceWith(tmp.firstElementChild);
}

window.addEventListener('DOMContentLoaded', async () => {
  const { data: authData } = await sb.auth.getSession();
  if (!authData?.session?.user) { window.location.href = 'login.html'; return; }
  const parentId = authData.session.user.id;
  _accessToken   = authData.session.access_token;

  // Subscription check — gates session buttons
  try {
    const subRes = await fetch('/api/subscription?action=check', {
      headers: { 'Authorization': `Bearer ${_accessToken}` },
    });
    if (subRes.ok) {
      const subData = await subRes.json();
      _subscribed = subData.subscribed === true;
    }
  } catch (e) {
    console.error('[parent-dashboard] subscription check failed:', e.message);
  }

  // Lock header Print Test button for unsubscribed parents
  if (!_subscribed) {
    const headerPrintBtn = document.querySelector('a[href="real-life-test.html"]');
    if (headerPrintBtn) headerPrintBtn.href = 'pricing.html';
  }

  // 1. Fetch own profile (child set up during onboarding lives here, not in a parent_id row)
  const { data: ownProfile } = await sb
    .from('profiles')
    .select('id, name, year_group, exam_year, sessions_per_week')
    .eq('id', parentId)
    .single();

  // 2. Fetch additional children added via add-child.html
  const { data: children, error: childErr } = await sb
    .from('profiles')
    .select('id, name, year_group, exam_year, sessions_per_week')
    .eq('parent_id', parentId)
    .order('name', { ascending: true });

  if (childErr) {
    document.getElementById('content').textContent = 'Error loading children. Please refresh.';
    console.error('[parent-dashboard] children error:', childErr.message);
    document.body.style.opacity = '1';
    return;
  }

  // Combine: own profile (if it has year_group from onboarding) + additional children
  const linkedChildren = children || [];
  const linkedIds = new Set(linkedChildren.map(c => c.id));
  const kids = [
    ...(ownProfile?.year_group && !linkedIds.has(ownProfile.id) ? [ownProfile] : []),
    ...linkedChildren,
  ];
  document.getElementById('ph-sub').textContent =
    kids.length === 0 ? 'No children linked yet.' :
    kids.length === 1 ? '1 child linked to your account.' :
    `${kids.length} children linked to your account.`;

  if (kids.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👨‍👩‍👧</div>
        <div class="empty-title">No children linked yet</div>
        <div class="empty-sub">Your child's details will appear here once your account is set up.</div>
        <a class="btn-add-child" href="add-child.html">+ Add a Child</a>
      </div>`;
    document.getElementById('content').className = '';
    document.body.style.opacity = '1';
    return;
  }

  const childIds = kids.map(c => c.id);

  // 2. Fetch sessions + progress via service-role API to bypass RLS
  //    (parent's anon token can't read children's session rows directly)
  const statsRes = await fetch('/api/child?action=get-parent-stats', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${_accessToken}`,
    },
    body: JSON.stringify({ childIds }),
  });

  const stats = statsRes.ok ? await statsRes.json() : { sessions: [], progress: [], questionResults: [] };
  if (!statsRes.ok) console.error('[parent-dashboard] get-parent-stats error:', statsRes.status);

  const allSessions = stats.sessions        || [];
  const allProgress = stats.progress        || [];
  const allQR       = stats.questionResults || [];

  // 3. Group by child id
  childIds.forEach(id => { _sessionsByChild[id] = []; _qrByChild[id] = []; });
  allSessions.forEach(s => { if (_sessionsByChild[s.user_id]) _sessionsByChild[s.user_id].push(s); });
  allProgress.forEach(p => { _progressByChild[p.user_id] = p; });
  allQR.forEach(r => { if (_qrByChild[r.user_id]) _qrByChild[r.user_id].push(r); });

  // 4. Store kids in module scope for card refresh
  _kidsData = kids;
  kids.forEach((c, i) => { _kidsIdx[c.id] = i; });

  // 5. Render
  const grid = document.createElement('div');
  grid.className = 'children-grid';
  grid.innerHTML = kids.map((child, i) => {
    const childSessions = _sessionsByChild[child.id] || [];
    const childQr       = _qrByChild[child.id]       || [];
    const insights      = computeInsights(childSessions, childQr);
    const insightsHtml  = buildInsightsHtml(insights, child.id);
    return buildCard(child, i, childSessions, _progressByChild[child.id] || null, insightsHtml, _subscribed, childQr);
  }).join('');
  document.getElementById('content').replaceWith(grid);
  document.body.style.opacity = '1';
});
</script>
