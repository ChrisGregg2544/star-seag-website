<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Server-verified admin gate (password checked by /api/admin-login, sets an httpOnly cookie)
  (async function adminGate() {
    const HOME = '../index.html';
    try {
      const check = await fetch('/api/admin-login', { method: 'GET', credentials: 'same-origin' });
      if (check.ok) return;
    } catch {}
    const pw = prompt('Admin password required:');
    if (!pw) { window.location.replace(HOME); return; }
    try {
      const r = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ password: pw }),
      });
      if (r.ok) window.location.reload();
      else window.location.replace(HOME);
    } catch { window.location.replace(HOME); }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR — Reports</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --text: #e8eaf0;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 20px; }
  header h1 { font-size: 1rem; font-weight: 700; flex: 1; }
  header a { color: var(--muted); font-size: .82rem; text-decoration: none; }
  header a:hover { color: var(--text); }

  .stats-bar { display: flex; gap: 32px; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .stat-num { font-size: 1.6rem; font-weight: 800; }
  .stat-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }

  .toolbar { padding: 12px 24px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 14px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; font-family: inherit; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .list { padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; max-width: 860px; }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .q-card.deactivated { opacity: .5; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .topic-badge { font-size: .65rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }
  .report-badge { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.25); }
  .date-text { font-size: .72rem; color: var(--muted); }
  .status-active { font-size: .72rem; font-weight: 700; color: var(--green); }
  .status-deactivated { font-size: .72rem; font-weight: 700; color: var(--muted); }
  .q-text { font-size: .88rem; color: var(--text); line-height: 1.55; margin-bottom: 12px; }
  .q-actions { display: flex; gap: 8px; }
  .btn-deactivate { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--red); border-radius: 8px; padding: 5px 14px; font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-deactivate:hover:not(:disabled) { background: rgba(248,113,113,.2); }
  .btn-deactivate:disabled { opacity: .4; cursor: not-allowed; }
  .btn-dismiss { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 14px; font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-dismiss:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .btn-dismiss:disabled { opacity: .4; cursor: not-allowed; }
  .btn-reactivate { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: var(--green); border-radius: 8px; padding: 5px 14px; font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-reactivate:hover:not(:disabled) { background: rgba(52,211,153,.2); }
  .btn-reactivate:disabled { opacity: .4; cursor: not-allowed; }

  .loading { padding: 48px 24px; text-align: center; color: var(--muted); font-size: .9rem; }
  .empty { padding: 64px 24px; text-align: center; color: var(--muted); }
  .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .empty p { font-size: .9rem; }
  .err { padding: 20px 24px; color: var(--red); font-size: .88rem; }

  @media (max-width: 600px) {
    .stats-bar { gap: 20px; padding: 12px 16px; }
    .list { padding: 12px 16px; }
    .toolbar { padding: 10px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>🚩 Reports — Flagged Questions</h1>
  <a href="../validate.html">Validator</a>
  <a href="../review.html">Review</a>
</header>

<div class="stats-bar">
  <div><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Reports</div></div>
  <div><div class="stat-num" id="stat-unique">—</div><div class="stat-label">Unique Questions</div></div>
  <div><div class="stat-num" id="stat-active">—</div><div class="stat-label">Active (needs review)</div></div>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('active', this)">Active Only</button>
  <button class="filter-btn" onclick="setFilter('deactivated', this)">Deactivated</button>
</div>

<div id="list" class="list"><div class="loading">Loading reports…</div></div>

<script>
let allReports = [];
let currentFilter = 'all';

async function load() {
  try {
    const res  = await fetch('/api/admin?action=get-reports');
    const data = await res.json();
    if (!data.ok) {
      document.getElementById('list').innerHTML = `<div class="err">Error: ${data.error}</div>`;
      return;
    }
    allReports = (data.reports || []).map(r => ({ ...r, dismissed: false }));
    updateStats();
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="err">Failed to load: ${e.message}</div>`;
  }
}

function updateStats() {
  const total  = allReports.reduce((s, r) => s + r.report_count, 0);
  const unique = allReports.length;
  const active = allReports.filter(r => r.validated && !r.dismissed).length;
  document.getElementById('stat-total').textContent  = total;
  document.getElementById('stat-unique').textContent = unique;
  document.getElementById('stat-active').textContent = active;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function render() {
  const list = document.getElementById('list');
  let items = allReports;
  if (currentFilter === 'active')      items = items.filter(r => r.validated && !r.dismissed);
  if (currentFilter === 'deactivated') items = items.filter(r => !r.validated);

  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><div class="icon">✅</div><p>No questions in this view.</p></div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const statusHtml = r.validated
      ? `<span class="status-active">● Active</span>`
      : `<span class="status-deactivated">● Deactivated</span>`;
    const qText = r.question_text.length > 240
      ? r.question_text.slice(0, 237) + '…'
      : r.question_text;
    const actionBtn = r.validated
      ? `<button class="btn-deactivate" onclick="deactivate('${r.question_id}', this)">Deactivate</button>`
      : `<button class="btn-reactivate" onclick="reactivate('${r.question_id}', this)">Reactivate</button>`;
    return `
      <div class="q-card ${r.validated ? '' : 'deactivated'}" id="card-${r.question_id}">
        <div class="q-meta">
          <span class="topic-badge">${r.topic || 'unknown'}</span>
          <span class="report-badge">🚩 ${r.report_count} report${r.report_count !== 1 ? 's' : ''}</span>
          <span class="date-text">Last: ${fmtDate(r.latest_reported_at)}</span>
          ${statusHtml}
        </div>
        <div class="q-text">${qText}</div>
        <div class="q-actions">
          ${actionBtn}
          <button class="btn-dismiss" ${r.dismissed ? 'disabled' : `onclick="dismiss('${r.question_id}', this)"`}>${r.dismissed ? 'Dismissed ✓' : 'Dismiss'}</button>
        </div>
      </div>`;
  }).join('');
}

async function deactivate(questionId, btn) {
  if (!confirm('Deactivate this question? It will no longer appear in student sessions.')) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/api/admin?action=deactivate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionId }),
    });
    if (res.ok) {
      const r = allReports.find(r => r.question_id === questionId);
      if (r) r.validated = false;
      updateStats();
      render();
    } else {
      btn.textContent = 'Deactivate';
      btn.disabled = false;
      alert('Error — check the console.');
    }
  } catch (e) {
    btn.textContent = 'Deactivate';
    btn.disabled = false;
  }
}

async function reactivate(questionId, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/api/admin?action=reactivate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionId }),
    });
    if (res.ok) {
      const r = allReports.find(r => r.question_id === questionId);
      if (r) r.validated = true;
      updateStats();
      render();
    } else {
      btn.textContent = 'Reactivate';
      btn.disabled = false;
      alert('Error — check the console.');
    }
  } catch (e) {
    btn.textContent = 'Reactivate';
    btn.disabled = false;
  }
}

async function dismiss(questionId, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/api/admin?action=dismiss-reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionId }),
    });
    if (res.ok) {
      const r = allReports.find(r => r.question_id === questionId);
      if (r) r.dismissed = true;
      updateStats();
      render();
    } else {
      btn.textContent = 'Dismiss';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = 'Dismiss';
    btn.disabled = false;
  }
}

load();
</script>
</body>
</html>
