<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR AI Tutor — Create Account</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
  <script src="cookie-consent.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #FEF3E2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1A1A1A;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: #F97316;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1A1A1A;
      margin-bottom: 6px;
      text-align: center;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6B7280;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      background: #fff;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1A1A1A;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }

    .google-btn:hover {
      border-color: #D1D5DB;
      background: #F9FAFB;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .divider span {
      font-size: 0.8rem;
      color: #9CA3AF;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: #1A1A1A;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #F97316;
    }

    .create-btn {
      width: 100%;
      padding: 15px;
      background: #F97316;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
      letter-spacing: -0.2px;
    }

    .create-btn:hover { background: #EA6C0A; }
    .create-btn:active { transform: scale(0.98); }
    .create-btn:disabled { background: #D1D5DB; cursor: not-allowed; }

    .error-msg {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.84rem;
      color: #DC2626;
      margin-bottom: 16px;
      display: none;
    }

    .login-link {
      text-align: center;
      font-size: 0.86rem;
      color: #6B7280;
    }

    .login-link a {
      color: #F97316;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover { text-decoration: underline; }

    .pw-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .pw-wrap input[type="password"],
    .pw-wrap input[type="text"] {
      margin-bottom: 0;
      padding-right: 48px;
    }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9CA3AF;
      line-height: 0;
    }
    .pw-toggle:hover { color: #6B7280; }

    .trial-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #FFF7ED;
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #C2410C;
      margin-bottom: 28px;
    }

    /* Success state */
    .success-screen {
      display: none;
      text-align: center;
      padding: 12px 0;
    }

    .success-screen.visible { display: block; }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .success-screen h2 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .success-screen p {
      font-size: 0.9rem;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .continue-btn {
      display: inline-block;
      background: #F97316;
      color: #fff;
      padding: 14px 36px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .continue-btn:hover { background: #EA6C0A; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<div class="card">
  <a href="index.html" class="logo">⭐ STAR AI Tutor</a>

  <div id="signup-form">
    <h1>Create your account</h1>
    <p class="subtitle">Start free — then 7-day trial, £15/month after</p>

    <div class="trial-badge">✅ 3 free sessions · 7-day trial · Cancel anytime</div>

    <button class="google-btn" onclick="handleGoogleSignup()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or sign up with email</span></div>

    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="parent@example.com" autocomplete="email"/>

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
      <button class="pw-toggle" type="button" onclick="togglePassword('password', this)" aria-label="Show or hide password">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="create-btn" id="create-btn" onclick="handleEmailSignup()">Create Account</button>

    <div class="login-link">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <div class="success-screen" id="success-screen">
    <span class="success-icon">🎉</span>
    <h2>Account created!</h2>
    <p id="success-msg">Setting up your profile now…</p>
    <a href="onboarding.html" class="continue-btn" id="continue-btn">Continue to Setup →</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://iutcgogmxhaqgaxkznxu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHiding = input.type === 'text';
    input.type = isHiding ? 'password' : 'text';
    btn.style.opacity = isHiding ? '1' : '0.5';
  }

  async function handleGoogleSignup() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/onboarding.html' }
    });
    if (error) showError(error.message);
  }

  async function handleEmailSignup() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('create-btn');
    const errEl    = document.getElementById('error-msg');

    if (!email || !password) { showError('Please enter your email and a password.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }

    btn.textContent = 'Creating account…';
    btn.disabled    = true;
    errEl.style.display = 'none';

    const { data, error } = await sb.auth.signUp({ email, password });

    if (error) {
      showError(error.message);
      btn.textContent = 'Create Account';
      btn.disabled    = false;
      return;
    }

    const user    = data?.user;
    const session = data?.session;

    if (session && user) {
      await sb.from('profiles').upsert({
        id:           user.id,
        parent_email: email,
        onboarded:    false,
        updated_at:   new Date().toISOString()
      }, { onConflict: 'id' });

      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('success-screen').classList.add('visible');
      setTimeout(() => { window.location.href = 'onboarding.html'; }, 1000);
    } else {
      document.getElementById('success-msg').innerHTML =
        'We\'ve sent a confirmation link to <strong>' + email + '</strong>.<br>Click it to activate your account, then log in.';
      document.getElementById('continue-btn').href = 'login.html';
      document.getElementById('continue-btn').textContent = 'Go to Login →';
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('success-screen').classList.add('visible');
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleEmailSignup();
  });
</script>

</body>
</html>
