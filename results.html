<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR – Results History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cookie-consent.js"></script>
  <style>
    :root {
      --gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.14);
      --navy:#0B1F3A;--navy-mid:#0f2747;--navy-card:#112240;
      --card-bg:rgba(255,255,255,0.97);--card-border:rgba(201,168,76,0.22);
      --text-dark:#0B1F3A;--text-mid:#3a5070;--text-light:#6b85a0;
      --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
      --radius:20px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{height:100%;scroll-behavior:smooth;}
    body{background:var(--navy);min-height:100vh;font-family:'Lato',sans-serif;
      display:flex;flex-direction:column;align-items:center;
      padding:0 16px 60px;overflow-x:hidden;position:relative;}

    /* Background */
    .bg-atmosphere{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .bg-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.05) 0%,transparent 65%);width:800px;height:800px;top:10%;left:50%;transform:translateX(-50%);}
    .bg-glow-2{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.03) 0%,transparent 70%);width:500px;height:500px;bottom:-80px;right:-100px;}
    @keyframes twinkle{from{opacity:.03;}to{opacity:.16;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

    /* Nav */
    .top-nav{position:relative;z-index:10;width:100%;max-width:860px;
      display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;}
    .nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
    .nav-logo-wordmark{display:flex;flex-direction:column;line-height:1;gap:2px;}
    .nav-logo-name{font-family:Georgia,'Times New Roman',serif;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.06em;}
    .nav-logo-sub{font-family:'Lato',sans-serif;font-size:.52rem;font-weight:700;color:rgba(201,168,76,.65);letter-spacing:.2em;text-transform:uppercase;}
    .nav-right{display:flex;align-items:center;gap:14px;}
    .nav-back{font-size:.78rem;color:rgba(255,255,255,.45);text-decoration:none;transition:color .2s;}
    .nav-back:hover{color:rgba(255,255,255,.8);}

    /* Page header */
    .page-header{
      position:relative;z-index:10;width:100%;max-width:860px;
      background:linear-gradient(135deg,var(--navy-card) 0%,#0d1e38 100%);
      border:1px solid rgba(201,168,76,.18);border-radius:24px;
      padding:36px 40px;margin-bottom:28px;overflow:hidden;
      animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .page-header::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;
      border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 70%);pointer-events:none;}
    .ph-eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:6px;}
    .ph-title{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#fff;line-height:1.2;margin-bottom:6px;}
    .ph-title span{color:var(--gold);}
    .ph-sub{font-size:.9rem;color:rgba(255,255,255,.42);line-height:1.6;}

    /* Sessions list */
    .sessions-wrap{position:relative;z-index:10;width:100%;max-width:860px;
      animation:fadeUp .55s .06s cubic-bezier(.22,1,.36,1) both;}
    .empty-state{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
      border-radius:var(--radius);padding:48px;text-align:center;color:rgba(255,255,255,.4);font-size:.95rem;}

    /* Session card */
    .session-card{
      background:var(--navy-card);border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);margin-bottom:14px;overflow:hidden;
      transition:border-color .2s;
    }
    .session-card:hover{border-color:rgba(201,168,76,.2);}
    .session-main{
      display:grid;grid-template-columns:auto 1fr auto;
      align-items:center;gap:20px;padding:20px 24px;cursor:pointer;
    }
    .session-score-circle{
      width:56px;height:56px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:.85rem;font-weight:900;font-family:'Lato',sans-serif;
    }
    .sc-green{background:rgba(34,197,94,.15);color:var(--green);border:2px solid rgba(34,197,94,.3);}
    .sc-amber{background:rgba(245,158,11,.12);color:var(--amber);border:2px solid rgba(245,158,11,.25);}
    .sc-red{background:rgba(239,68,68,.12);color:var(--red);border:2px solid rgba(239,68,68,.25);}

    .session-info{min-width:0;}
    .session-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;}
    .session-date{font-size:.78rem;color:rgba(255,255,255,.4);}
    .session-type-badge{
      font-size:.65rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
      padding:3px 9px;border-radius:20px;
    }
    .badge-sprint{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
    .badge-topic{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,.25);}
    .badge-mock{background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.2);}
    .session-score-text{font-size:.95rem;font-weight:700;color:#fff;}
    .session-score-sub{font-size:.78rem;color:rgba(255,255,255,.35);margin-top:2px;}

    .session-chevron{color:rgba(255,255,255,.25);font-size:1.1rem;transition:transform .2s,color .2s;flex-shrink:0;}
    .session-card.open .session-chevron{transform:rotate(90deg);color:rgba(201,168,76,.6);}

    /* Topic breakdown */
    .topic-breakdown{
      display:none;border-top:1px solid rgba(255,255,255,.06);
      padding:16px 24px 20px;
    }
    .session-card.open .topic-breakdown{display:block;}
    .tb-title{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(255,255,255,.3);margin-bottom:12px;}
    .tb-row{
      display:grid;grid-template-columns:1fr 80px 80px 100px;
      align-items:center;gap:12px;padding:8px 0;
      border-bottom:1px solid rgba(255,255,255,.04);
      font-size:.82rem;
    }
    .tb-row:last-child{border-bottom:none;}
    .tb-topic{color:rgba(255,255,255,.7);font-weight:600;}
    .tb-correct{color:var(--green);font-weight:700;text-align:center;}
    .tb-wrong{color:var(--red);font-weight:700;text-align:center;}
    .tb-pct{font-weight:700;text-align:right;}
    .tb-pct.pct-green{color:var(--green);}
    .tb-pct.pct-amber{color:var(--amber);}
    .tb-pct.pct-red{color:var(--red);}
    .tb-header{font-size:.65rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
      color:rgba(255,255,255,.25);}
    .tb-loading{color:rgba(255,255,255,.3);font-size:.82rem;padding:8px 0;}
    .tb-empty{color:rgba(255,255,255,.3);font-size:.82rem;padding:8px 0;font-style:italic;}
  </style>
</head>
<body>

<div class="bg-atmosphere">
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
</div>

<nav class="top-nav">
  <a class="nav-logo" href="dashboard.html">
    <svg class="nav-logo-mark" width="28" height="28" viewBox="0 0 40 40" fill="none">
      <polygon points="20,3 25,15 38,15 28,23 32,36 20,28 8,36 12,23 2,15 15,15" fill="#C9A84C" opacity=".9"/>
    </svg>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;TUTOR</span>
    </div>
  </a>
  <div class="nav-right">
    <a href="dashboard.html" class="nav-back">← Back to Dashboard</a>
  </div>
</nav>

<div class="page-header">
  <div class="ph-eyebrow">📊 Progress</div>
  <div class="ph-title">Your <span>Results</span> History</div>
  <div class="ph-sub" id="ph-sub">Loading your sessions…</div>
</div>

<div class="sessions-wrap" id="sessions-wrap">
  <div class="empty-state">Loading…</div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iutcgogmxhaqgaxkznxu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
);

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return ''; }
}

function scoreClass(pct) {
  return pct >= 70 ? 'sc-green' : pct >= 40 ? 'sc-amber' : 'sc-red';
}

function pctClass(pct) {
  return pct >= 70 ? 'pct-green' : pct >= 40 ? 'pct-amber' : 'pct-red';
}

function typeBadge(sessionType) {
  if (sessionType === 'full_mock' || sessionType === 'mock') return { label: 'Full Mock', cls: 'badge-mock' };
  if (sessionType === 'topic_sprint') return { label: 'Topic Sprint', cls: 'badge-topic' };
  return { label: 'Quick Sprint', cls: 'badge-sprint' };
}

// Cache for question_results per session
const qrCache = {};

async function loadTopicBreakdown(sessionId, container) {
  if (qrCache[sessionId]) {
    renderTopicBreakdown(qrCache[sessionId], container);
    return;
  }
  container.innerHTML = '<div class="tb-loading">Loading breakdown…</div>';
  const { data, error } = await sb
    .from('question_results')
    .select('topic, correct')
    .eq('session_id', sessionId);

  if (error || !data) {
    container.innerHTML = '<div class="tb-empty">Could not load breakdown.</div>';
    return;
  }
  qrCache[sessionId] = data;
  renderTopicBreakdown(data, container);
}

function renderTopicBreakdown(rows, container) {
  const topicMap = {};
  rows.forEach(r => {
    if (!r.topic) return;
    if (!topicMap[r.topic]) topicMap[r.topic] = { correct: 0, total: 0 };
    topicMap[r.topic].total++;
    if (r.correct) topicMap[r.topic].correct++;
  });

  const topics = Object.entries(topicMap).sort((a, b) => b[1].total - a[1].total);

  if (topics.length === 0) {
    container.innerHTML = '<div class="tb-empty">No per-topic data available for this session.</div>';
    return;
  }

  let html = `
    <div class="tb-row">
      <span class="tb-header">Topic</span>
      <span class="tb-header" style="text-align:center">Correct</span>
      <span class="tb-header" style="text-align:center">Wrong</span>
      <span class="tb-header" style="text-align:right">Accuracy</span>
    </div>`;

  topics.forEach(([topic, d]) => {
    const pct = d.total ? Math.round(d.correct / d.total * 100) : 0;
    const wrong = d.total - d.correct;
    html += `
      <div class="tb-row">
        <span class="tb-topic">${topic}</span>
        <span class="tb-correct">${d.correct}</span>
        <span class="tb-wrong">${wrong}</span>
        <span class="tb-pct ${pctClass(pct)}">${pct}%</span>
      </div>`;
  });

  container.innerHTML = html;
}

function buildSessionCard(s) {
  const total = s.total_questions || 1;
  const pct   = Math.round((s.score / total) * 100);
  const badge = typeBadge(s.session_type);
  const date  = formatDate(s.completed_at);
  const scCls = scoreClass(pct);

  const card = document.createElement('div');
  card.className = 'session-card';
  card.dataset.sessionId = s.id;

  card.innerHTML = `
    <div class="session-main">
      <div class="session-score-circle ${scCls}">${pct}%</div>
      <div class="session-info">
        <div class="session-meta">
          <span class="session-date">${date}</span>
          <span class="session-type-badge ${badge.cls}">${badge.label}</span>
        </div>
        <div class="session-score-text">${s.score} of ${total} correct</div>
        <div class="session-score-sub">${pct >= 70 ? 'Great work! 🌟' : pct >= 40 ? 'Good effort ⭐' : 'Keep going! 💪'}</div>
      </div>
      <span class="session-chevron">›</span>
    </div>
    <div class="topic-breakdown" id="tb-${s.id}">
      <div class="tb-title">Topic Breakdown</div>
      <div class="tb-loading">Loading…</div>
    </div>`;

  // Toggle open/close on click
  card.querySelector('.session-main').addEventListener('click', async () => {
    const isOpen = card.classList.contains('open');
    card.classList.toggle('open');
    if (!isOpen) {
      const tbContainer = card.querySelector(`#tb-${s.id} .tb-loading, #tb-${s.id} .tb-empty, #tb-${s.id} .tb-row`);
      const tbDiv = document.getElementById(`tb-${s.id}`);
      // Find the inner content div (after the title)
      const inner = document.createElement('div');
      tbDiv.querySelector('.tb-loading') && tbDiv.querySelector('.tb-loading').replaceWith(inner);
      await loadTopicBreakdown(s.id, inner);
    }
  });

  return card;
}

async function init() {
  const { data: authData } = await sb.auth.getSession();
  if (!authData?.session?.user) { window.location.href = 'login.html'; return; }
  const userId = authData.session.user.id;

  const { data: profile } = await sb.from('profiles')
    .select('name')
    .eq('id', userId)
    .maybeSingle();

  const name = profile?.name || 'Student';

  const { data: sessions, error } = await sb
    .from('sessions')
    .select('id, score, total_questions, session_type, completed_at')
    .eq('user_id', userId)
    .order('completed_at', { ascending: false })
    .limit(100);

  const wrap = document.getElementById('sessions-wrap');

  if (error) {
    document.getElementById('ph-sub').textContent = 'Could not load sessions.';
    wrap.innerHTML = '<div class="empty-state">Error loading results. Please try again.</div>';
    return;
  }

  const list = sessions || [];
  document.getElementById('ph-sub').textContent =
    name + ' · ' + list.length + ' session' + (list.length !== 1 ? 's' : '') + ' completed';

  if (list.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No sessions yet — complete your first sprint to see results here!</div>';
    return;
  }

  wrap.innerHTML = '';
  list.forEach(s => wrap.appendChild(buildSessionCard(s)));
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
