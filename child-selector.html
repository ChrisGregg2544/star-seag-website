<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STAR — Select Child</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cookie-consent.js"></script>
  <style>
    :root {
      --gold:       #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim:   rgba(201,168,76,0.14);
      --navy:       #0B1F3A;
      --navy-mid:   #0f2747;
      --navy-card:  #112240;
      --text-light: rgba(255,255,255,0.42);
      --green:      #22c55e;
      --radius:     20px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; }
    body {
      background:var(--navy); min-height:100vh;
      font-family:'Lato',sans-serif;
      display:flex; flex-direction:column; align-items:center;
      padding:0 16px 60px; overflow-x:hidden;
    }

    /* ── Background atmosphere ── */
    .bg-atmosphere { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
    .bg-glow { position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.05) 0%,transparent 65%);width:800px;height:800px;top:10%;left:50%;transform:translateX(-50%); }
    .star-p { position:absolute;border-radius:50%;background:var(--gold);opacity:.07;animation:twinkle var(--d,3.8s) ease-in-out infinite alternate;animation-delay:var(--del,0s); }
    @keyframes twinkle { from{opacity:.03;} to{opacity:.16;} }

    /* ── Nav ── */
    .top-nav {
      position:relative;z-index:10;
      width:100%;max-width:700px;
      display:flex;align-items:center;justify-content:space-between;
      padding:22px 0 18px;
    }
    .nav-logo { display:flex;align-items:center;gap:9px;text-decoration:none; }
    .nav-logo-wordmark { display:flex;flex-direction:column;line-height:1;gap:2px; }
    .nav-logo-name { font-family:Georgia,'Times New Roman',serif;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.06em; }
    .nav-logo-sub { font-size:.52rem;font-weight:700;color:rgba(201,168,76,.65);letter-spacing:.2em;text-transform:uppercase; }
    .nav-sign-out {
      font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
      color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;
      transition:color .18s;
    }
    .nav-sign-out:hover { color:rgba(255,255,255,.65); }

    /* ── Page header ── */
    .page-header {
      position:relative;z-index:10;
      width:100%;max-width:700px;
      text-align:center;
      padding:48px 24px 36px;
      animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .ph-eyebrow {
      font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
      color:rgba(201,168,76,.6);margin-bottom:10px;
    }
    .ph-title {
      font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;
      color:#fff;line-height:1.2;margin-bottom:10px;
    }
    .ph-title span { color:var(--gold); }
    .ph-sub { font-size:.92rem;color:rgba(255,255,255,.4);line-height:1.6; }

    /* ── Loading state ── */
    .loading {
      position:relative;z-index:10;
      color:rgba(255,255,255,.35);font-size:.9rem;
      padding:40px 0;text-align:center;
    }

    /* ── Child grid ── */
    .child-grid {
      position:relative;z-index:10;
      width:100%;max-width:700px;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:16px;
      animation:fadeUp .55s .08s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Child card ── */
    .child-card {
      background:var(--navy-card);
      border:1px solid rgba(201,168,76,.18);
      border-radius:24px;
      padding:32px 20px 28px;
      text-align:center;
      cursor:pointer;
      transition:transform .2s, box-shadow .2s, border-color .2s;
      text-decoration:none;
      display:flex;flex-direction:column;align-items:center;gap:14px;
      position:relative;overflow:hidden;
    }
    .child-card::before {
      content:'';position:absolute;inset:0;border-radius:24px;
      background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.06) 0%,transparent 60%);
      pointer-events:none;
    }
    .child-card:hover {
      transform:translateY(-4px);
      box-shadow:0 16px 48px rgba(0,0,0,.4), 0 0 0 1px rgba(201,168,76,.4);
      border-color:rgba(201,168,76,.5);
    }
    .child-card:active { transform:translateY(-1px); }

    .child-avatar {
      width:72px;height:72px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;
      box-shadow:0 8px 24px rgba(201,168,76,.3);
      flex-shrink:0;
    }
    .child-name {
      font-family:'Playfair Display',serif;
      font-size:1.15rem;font-weight:900;color:#fff;
      line-height:1.2;
    }
    .child-year {
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px;border-radius:99px;
      font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
      background:var(--gold-dim);color:var(--gold);
      border:1px solid rgba(201,168,76,.3);
    }
    .child-cta {
      font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:rgba(255,255,255,.28);
      transition:color .18s;
    }
    .child-card:hover .child-cta { color:var(--gold); }

    /* ── Empty state ── */
    .empty-state {
      position:relative;z-index:10;
      width:100%;max-width:500px;
      text-align:center;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:56px 40px;
      animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .empty-icon { font-size:3rem;margin-bottom:16px; }
    .empty-title {
      font-family:'Playfair Display',serif;
      font-size:1.25rem;font-weight:900;color:#fff;margin-bottom:8px;
    }
    .empty-sub { font-size:.88rem;color:rgba(255,255,255,.38);line-height:1.6;margin-bottom:28px; }
    .btn-add {
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 28px;border-radius:12px;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--navy);font-family:'Lato',sans-serif;
      font-size:.88rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
      text-decoration:none;border:none;cursor:pointer;
      box-shadow:0 6px 20px rgba(201,168,76,.3);
      transition:transform .18s, box-shadow .18s;
    }
    .btn-add:hover { transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,168,76,.45); }
  </style>
</head>
<body>

<div class="bg-atmosphere">
  <div class="bg-glow"></div>
  <div class="star-p" style="width:6px;height:6px;top:12%;left:8%;  --d:4.1s;--del:.3s"></div>
  <div class="star-p" style="width:4px;height:4px;top:35%;left:92%; --d:3.5s;--del:1.1s"></div>
  <div class="star-p" style="width:5px;height:5px;top:65%;left:5%;  --d:5.2s;--del:.7s"></div>
  <div class="star-p" style="width:3px;height:3px;top:80%;left:88%; --d:3.9s;--del:2s"></div>
</div>

<nav class="top-nav">
  <a class="nav-logo" href="index.html">
    <svg width="36" height="36" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="#0B1F3A" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.45"/>
      <polygon points="20,12 22.06,17.17 27.61,17.53 23.33,21.08 24.70,26.47 20,23.5 15.30,26.47 16.67,21.08 12.39,17.53 17.94,17.17" fill="#C9A84C"/>
    </svg>
    <div class="nav-logo-wordmark">
      <span class="nav-logo-name">STAR</span>
      <span class="nav-logo-sub">AI&nbsp;TUTOR</span>
    </div>
  </a>
  <button class="nav-sign-out" onclick="signOut()">Sign out</button>
</nav>

<div class="page-header">
  <div class="ph-eyebrow">Parent Portal</div>
  <div class="ph-title">Who's <span>studying</span> today?</div>
  <div class="ph-sub">Select a child to view their dashboard and begin a session.</div>
</div>

<div id="content" class="loading">Loading children…</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iutcgogmxhaqgaxkznxu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dGNnb2dteGhhcWdheGt6bnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjE4MTQsImV4cCI6MjA4OTMzNzgxNH0.o0plRQzH8ezfttG_sEeWu3F4IUtKnyzcXtPEGJ9xRF0'
);

const AVATARS = ['👦', '👧', '🧒', '👶', '🌟', '⭐'];

function selectChild(childId) {
  localStorage.setItem('selectedChildId', childId);
  window.location.href = 'study.html';
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

function renderChildren(children) {
  const container = document.getElementById('content');

  if (children.length === 0) {
    container.className = '';
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👨‍👩‍👧</div>
        <div class="empty-title">No children linked yet</div>
        <div class="empty-sub">Add your child's account to start tracking their SEAG progress.</div>
        <a class="btn-add" href="onboarding.html">+ Add a Child</a>
      </div>`;
    return;
  }

  container.className = 'child-grid';
  container.innerHTML = children.map((child, i) => {
    const avatar = AVATARS[i % AVATARS.length];
    const yearLabel = child.year_group === 'P7' ? 'P7 — Year 7' : 'P6 — Year 6';
    return `
      <div class="child-card" onclick="selectChild('${child.id}')">
        <div class="child-avatar">${avatar}</div>
        <div class="child-name">${escHtml(child.name || 'Child')}</div>
        <div class="child-year">${yearLabel}</div>
        <div class="child-cta">Select &rarr;</div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('DOMContentLoaded', async () => {
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData?.session?.user) {
    window.location.href = 'login.html';
    return;
  }

  const parentId = sessionData.session.user.id;

  const { data: children, error } = await sb
    .from('profiles')
    .select('id, name, year_group')
    .eq('parent_id', parentId)
    .order('name', { ascending: true });

  if (error) {
    document.getElementById('content').textContent = 'Error loading children. Please refresh.';
    console.error('Child load error:', error.message);
    return;
  }

  renderChildren(children || []);
});
</script>
</body>
</html>
